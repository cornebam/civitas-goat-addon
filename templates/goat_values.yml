# templates/goat_values.yml — rendered in-memory by tasks/templates/k8s-helm.yml
# Rendered by 03_helm_install.yml and passed to `helm install` as a values file.
#
# The whole stack is served from a single hostname (`goat_host`, derived from
# goat_addon.web.public_url — the operator sets it in inventory as
# inv_addons.goat.web.public_url). Path map:
#
#   /                → goat-web       (host root, no rewrite)
#   /core            → goat-core      (API_V2_STR handles the prefix, no rewrite)
#   /geoapi          → geoapi         (nginx rewrite-target)
#   /processes       → processes      (nginx rewrite-target)
#   /<bucket>        → MinIO (05_minio.yml) — path prefix must EQUAL the bucket
#                                       name so path-style SigV4 signatures
#                                       validate; no rewrite.
#   (windmill has no public ingress — processes reaches it in-cluster only)
#
# All ingresses share the same TLS secret (`s3_tls_secret_name`) since one
# hostname cannot be served by multiple secrets.
{%- set goat_host = goat_addon.web.public_url | regex_replace('^https?://', '') %}
{%- set s3_tls_secret_name = 'goat-' + DOMAIN + '-tls' %}
{#- S3 endpoint resolution. When `goat_addon.s3.mode == 'external'`, every
    chart service (goat-core / geoapi / processes / windmill worker-tools /
    workflows) points at the external S3-compatible endpoint (external
    MinIO, Cloudflare R2, Wasabi, Backblaze B2, AWS S3, …); otherwise at
    the in-namespace MinIO deployed by tasks/05_minio.yml.

    `s3_internal_endpoint` is the cluster-internal URL used by in-pod
    boto3 / DuckDB. `s3_public_endpoint` is the browser-facing URL
    substituted into presigned URLs — for the default MinIO it's the
    /<bucket> path on `goat_host`; for external services it's whatever
    the operator's inventory says (e.g. AWS S3 hostname, or an internal
    reverse proxy). `s3_endpoint_hostport` strips the scheme (and any
    trailing slash) because DuckDB's `s3_endpoint` setting wants host:port
    only. `s3_use_ssl` / `s3_url_style` are the DuckDB-shaped equivalents
    of `S3_ENDPOINT_URL` scheme + `S3_FORCE_PATH_STYLE`. #}
{%- set _s3 = goat_addon.s3 %}
{%- set s3_external = (_s3.mode == 'external') %}
{%- set s3_provider = _s3.provider %}
{%- set s3_internal_endpoint = _s3.endpoint if s3_external else 'http://minio.' + goat_addon.namespace + '.svc.cluster.local:9000' %}
{%- set s3_public_endpoint = _s3.public_endpoint if s3_external else 'https://' + goat_host %}
{%- set s3_region = _s3.region %}
{%- set s3_force_path_style = _s3.force_path_style %}
{%- set s3_force_path_style_str = 'true' if s3_force_path_style else 'false' %}
{%- set s3_endpoint_hostport = s3_internal_endpoint | regex_replace('/+$', '') | regex_replace('^https?://', '') %}
{%- set s3_use_ssl = 'true' if s3_internal_endpoint.startswith('https://') else 'false' %}
{%- set s3_url_style = 'path' if s3_force_path_style else 'vhost' %}
{#- Ingress routing profile for geoapi and processes. See
    goat_addon.ingress.profiles in vars/default.yml for the schema and
    the strategic note on why this exists. `is_nginx` gates annotations
    that are silently ignored on other controllers (proxy-body-size,
    ssl-redirect) so we do not clutter the ingress spec with dead keys. #}
{%- set ingress_profile = goat_addon.ingress.profiles[inv_k8s.ingress_class] %}
{%- set is_nginx = inv_k8s.ingress_class == 'nginx' %}

global:
  # inv_k8s.storage_class is a DICT in civitas-core ({loc, rwo, rwx}); the
  # chart wants a string. Pick `loc` (local, single-node) by default — works
  # for k3d and local clusters.
  storageClass: "{{ inv_k8s.storage_class.loc | default('local-path') }}"
  imagePullSecrets: []
  commonLabels:
    civitas.core/owner: goat-addon
    civitas.core/env: "{{ ENVIRONMENT }}"

{#-
  Image refs are sourced from vars/software_references.yml so civitas-core's
  image-mirror tooling can enumerate and pre-mirror every image this addon
  spins up. Override `registry:` in the inventory's
  `goat_addon_software.images.<svc>` block to point at a private mirror.

  The macro renders an `image:` block already indented to be a 2-space
  child of a top-level chart key (core, web, geoapi, etc.); usage:

      core:
        enabled: true
        {{ img('core') }}
#}
{%- macro img(svc) -%}
image:
    registry: "{{ goat_addon_software.images[svc].registry }}"
    repository: "{{ goat_addon_software.images[svc].repository }}"
    tag: "{{ goat_addon_software.images[svc].tag }}"
    pullPolicy: "{{ goat_addon_software.images[svc].pullPolicy | default('IfNotPresent') }}"
{%- endmacro %}

core:
  enabled: true
  {{ img('core') }}
  # goat-web's bundle calls the core API from the browser directly
  # (NEXT_PUBLIC_API_URL is baked in), so core must be reachable externally.
  # Mounted at /core under goat_host; API_V2_STR below carries the prefix so
  # no controller needs to rewrite. goat-core emits no absolute URLs.
  ingress:
    enabled: true
    className: "{{ inv_k8s.ingress_class }}"
    annotations:
      cert-manager.io/cluster-issuer: "{{ inv_k8s.cert_manager.issuer_name }}"
      kubernetes.io/ingress.class: "{{ inv_k8s.ingress_class }}"
{% if is_nginx %}      nginx.ingress.kubernetes.io/ssl-redirect: "true"
{% endif %}    hosts:
      - host: "{{ goat_host }}"
        paths:
          - path: /core
            pathType: Prefix
    tls:
      - secretName: "{{ s3_tls_secret_name }}"
        hosts:
          - "{{ goat_host }}"
  # AUTH=false: goat-core serves all data as the single default identity
  # (seeded by the chart's migrate hook); goat-web's NextAuth still gates
  # UI sign-in through civitas's Keycloak realm. Flipping this to true
  # switches civitas to real multi-user mode — users onboard their own
  # organization on first login, API-level permissions are enforced —
  # and additionally needs the Keycloak client's service account enabled
  # with the realm `view-users` role (user profile enrichment). Deliberate
  # product decision per tenant, not a config detail.
  auth:
    enabled: false
    existingSecret: goat-keycloak-creds
  # Chart ships placeholder S3 values under core.config that leak through if
  # we don't override them. Goat-core needs both:
  #   - S3_ENDPOINT_URL        — used by boto3 in-cluster (HTTP, internal)
  #   - S3_PUBLIC_ENDPOINT_URL — substituted into presigned URLs returned to
  #     the browser; must be HTTPS so the SPA's fetch isn't mixed-content
  #     blocked. With path-style S3 (S3_FORCE_PATH_STYLE=true, default) the
  #     browser hits `<S3_PUBLIC_ENDPOINT_URL>/<bucket>/…` — for the default
  #     in-namespace MinIO that's `https://<goat_host>/<bucket>/…` (routed
  #     via the ingress in 05_minio.yml); for external S3 it's whatever the
  #     provider serves. See goat/apps/core/src/core/services/s3.py.
  config:
    ENVIRONMENT: prod
    # API mounted at /core; goat-core reads API_V2_STR (BaseSettings, no
    # env_prefix — apps/core/src/core/core/config.py) and prepends it to
    # every route, so nginx doesn't rewrite. goat-web appends this to
    # NEXT_PUBLIC_API_URL when building URLs.
    API_V2_STR: "/core/api/v2"
    CLIENT_URL: "https://{{ goat_host }}"
    S3_PROVIDER: "{{ s3_provider }}"
    S3_ENDPOINT_URL: "{{ s3_internal_endpoint }}"
    S3_PUBLIC_ENDPOINT_URL: "{{ s3_public_endpoint }}"
    S3_REGION: "{{ s3_region }}"
    S3_BUCKET_NAME: "{{ goat_addon.s3.bucket }}"
    S3_FORCE_PATH_STYLE: "{{ s3_force_path_style_str }}"
    # Default org plan + quotas. These feed SELF_HOSTED_PLAN_METADATA in
    # apps/core/src/core/crud/crud_organization.py, which is the branch
    # taken when Stripe billing is not configured.
    #
    # STRIPE_SECRET_KEY MUST remain unset. In crud_organization.py the
    # 14-day trial flag is gated solely on `billing_enabled =
    # bool(settings.STRIPE_SECRET_KEY)`; with it unset, organizations are
    # created with on_trial=False and no renewal date. Setting the key
    # would flip every new org into a Stripe trial without a payment path.
    DEFAULT_PLAN_NAME: "goat_enterprise"
    DEFAULT_QUOTA_STORAGE_MB: "1048576"
    DEFAULT_QUOTA_PROJECTS: "10000"
    DEFAULT_QUOTA_EDITORS: "1000"
    DEFAULT_QUOTA_VIEWERS: "1000"
  extraEnv:
    - name: S3_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef: { name: minio-credentials, key: access_key }
    - name: S3_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef: { name: minio-credentials, key: secret_key }

geoapi:
  enabled: true
  {{ img('geoapi') }}
  config:
    ENVIRONMENT: prod
    DUCKLAKE_CREATE_IF_NOT_EXISTS: "true"
    # geoapi's own auth (separate from goat-web's NextAuth flow). It fetches
    # the realm public key from `<KEYCLOAK_SERVER_URL>/realms/<REALM_NAME>` at
    # startup via Python requests — must trust civitas's self-signed CA, so
    # we set REQUESTS_CA_BUNDLE + SSL_CERT_FILE in extraEnv below.
    AUTH: "true"
    KEYCLOAK_SERVER_URL: "{{ inv_access.platform.hostname }}"
    REALM_NAME: "{{ inv_access.tenant.realm_name }}"
    # Postgres connection for the DuckLake catalog schema. POSTGRES_USER /
    # POSTGRES_PASSWORD are auto-wired by the chart from the same secret as
    # goat-core (goat-postgres-creds → goat user). Same DB, separate schema.
    POSTGRES_SERVER: "{{ goat_addon.db.central_db_name }}.{{ goat_addon.db.central_db_ns }}.svc.cluster.local"
    POSTGRES_PORT: "5432"
    POSTGRES_DB: "{{ goat_addon.db.goat_db_name }}"
    DUCKLAKE_CATALOG_SCHEMA: "ducklake"
    # DATA_PATH for the DuckLake ATTACH. Must match what 05_minio.yml passed
    # to the ducklake-init Job. Upstream compose keeps this as a LOCAL path
    # even with S3 enabled — DuckLake stores parquet in S3 transparently via
    # the s3_* SET commands; the local path is just the catalog marker.
    DUCKLAKE_DATA_DIR: "/app/data/ducklake"
    # S3 endpoint. Default: the in-namespace MinIO (05_minio.yml). When
    # goat_addon.s3.mode == 'external' → any S3-compatible endpoint.
    S3_PROVIDER: "{{ s3_provider }}"
    S3_ENDPOINT_URL: "{{ s3_internal_endpoint }}"
    S3_REGION: "{{ s3_region }}"
    S3_BUCKET_NAME: "{{ goat_addon.s3.bucket }}"
  extraEnv:
    # Python requests/httpx/urllib use these envs to find a CA bundle.
    - name: REQUESTS_CA_BUNDLE
      value: /etc/ssl/civitas/ca.crt
    - name: SSL_CERT_FILE
      value: /etc/ssl/civitas/ca.crt
    - name: S3_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef: { name: minio-credentials, key: access_key }
    - name: S3_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef: { name: minio-credentials, key: secret_key }
  extraVolumes:
    - name: civitas-ca
      configMap:
        name: civitas-ca
        optional: true
    # Shared DuckLake data dir: layer_import (worker-tools) writes parquet
    # here, geoapi reads it for tile serving. Both pods must see the same
    # files — hence a single RWX PVC (provisioned by tasks/07_ducklake_pvc.yml
    # via inv_k8s.storage_class.rwx).
    - name: ducklake-data
      persistentVolumeClaim:
        claimName: goat-ducklake-data
  extraVolumeMounts:
    - name: civitas-ca
      mountPath: /etc/ssl/civitas
      readOnly: true
    - name: ducklake-data
      mountPath: /app/data
  # geoapi at /geoapi. Path shape + prefix stripping come from the ingress
  # profile — regex `rewrite-target` on nginx, `stripPrefix` Middleware on
  # Traefik. geoapi emits absolute URLs from request.base_url (missing the
  # prefix), but goat-web never consumes them — it composes every backend
  # URL itself from NEXT_PUBLIC_GEOAPI_URL.
  ingress:
    enabled: true
    className: "{{ inv_k8s.ingress_class }}"
    annotations:
      cert-manager.io/cluster-issuer: "{{ inv_k8s.cert_manager.issuer_name }}"
      kubernetes.io/ingress.class: "{{ inv_k8s.ingress_class }}"
{% if is_nginx %}      nginx.ingress.kubernetes.io/ssl-redirect: "true"
{% endif %}{% if ingress_profile.needs_middleware %}      traefik.ingress.kubernetes.io/router.middlewares: "{{ goat_addon.namespace }}-goat-strip-geoapi@kubernetescrd"
{% endif %}{% for k, v in ingress_profile.annotations.items() %}      {{ k }}: "{{ v }}"
{% endfor %}    hosts:
      - host: "{{ goat_host }}"
        paths:
          - path: "/geoapi{{ ingress_profile.path_suffix }}"
            pathType: "{{ ingress_profile.pathType }}"
    tls:
      - secretName: "{{ s3_tls_secret_name }}"
        hosts:
          - "{{ goat_host }}"

processes:
  enabled: true
  {{ img('processes') }}
  config:
    ENVIRONMENT: prod
    AUTH: "true"
    KEYCLOAK_SERVER_URL: "{{ inv_access.platform.hostname }}"
    REALM_NAME: "{{ inv_access.tenant.realm_name }}"
    POSTGRES_SERVER: "{{ goat_addon.db.central_db_name }}.{{ goat_addon.db.central_db_ns }}.svc.cluster.local"
    POSTGRES_PORT: "5432"
    POSTGRES_DB: "{{ goat_addon.db.goat_db_name }}"
    DUCKLAKE_CATALOG_SCHEMA: "ducklake"
    DUCKLAKE_DATA_DIR: "/app/data/ducklake"
    # processes' config.py declares BOTH S3_* (boto3-style) AND DUCKLAKE_S3_*
    # (consumed by goatlib's DuckLake managers via getattr on settings).
    S3_PROVIDER: "{{ s3_provider }}"
    S3_ENDPOINT_URL: "{{ s3_internal_endpoint }}"
    S3_REGION: "{{ s3_region }}"
    S3_BUCKET_NAME: "{{ goat_addon.s3.bucket }}"
    # DuckDB's `s3_endpoint` setting wants host:port only, no scheme; SSL
    # + URL style are separate settings. `region` matters for AWS S3
    # outside us-east-1 (SigV4 canonicalization). Keep the full set of
    # DUCKLAKE_S3_* here in sync with the ducklake-init Job env in
    # tasks/05_minio.yml so runtime attaches match what bootstrap wrote.
    DUCKLAKE_S3_ENDPOINT: "{{ s3_endpoint_hostport }}"
    DUCKLAKE_S3_BUCKET: "{{ goat_addon.s3.bucket }}"
    DUCKLAKE_S3_REGION: "{{ s3_region }}"
    DUCKLAKE_S3_USE_SSL: "{{ s3_use_ssl }}"
    DUCKLAKE_S3_URL_STYLE: "{{ s3_url_style }}"
    WINDMILL_URL: "http://goat-windmill-server"
    # Must match chart's `windmill.bootstrap.workspace` (default `goat`).
    WINDMILL_WORKSPACE: "goat"
  extraEnv:
    - name: REQUESTS_CA_BUNDLE
      value: /etc/ssl/civitas/ca.crt
    - name: SSL_CERT_FILE
      value: /etc/ssl/civitas/ca.crt
    - name: S3_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef: { name: minio-credentials, key: access_key }
    - name: S3_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef: { name: minio-credentials, key: secret_key }
    - name: DUCKLAKE_S3_ACCESS_KEY
      valueFrom:
        secretKeyRef: { name: minio-credentials, key: access_key }
    - name: DUCKLAKE_S3_SECRET_KEY
      valueFrom:
        secretKeyRef: { name: minio-credentials, key: secret_key }
  extraVolumes:
    - name: civitas-ca
      configMap:
        name: civitas-ca
        optional: true
  extraVolumeMounts:
    - name: civitas-ca
      mountPath: /etc/ssl/civitas
      readOnly: true
  # processes at /processes. Same profile-driven prefix-strip pattern as
  # geoapi. Same absolute-URL caveat — the UI composes URLs itself from
  # NEXT_PUBLIC_PROCESSES_URL.
  ingress:
    enabled: true
    className: "{{ inv_k8s.ingress_class }}"
    annotations:
      cert-manager.io/cluster-issuer: "{{ inv_k8s.cert_manager.issuer_name }}"
      kubernetes.io/ingress.class: "{{ inv_k8s.ingress_class }}"
{% if is_nginx %}      nginx.ingress.kubernetes.io/ssl-redirect: "true"
{% endif %}{% if ingress_profile.needs_middleware %}      traefik.ingress.kubernetes.io/router.middlewares: "{{ goat_addon.namespace }}-goat-strip-processes@kubernetescrd"
{% endif %}{% for k, v in ingress_profile.annotations.items() %}      {{ k }}: "{{ v }}"
{% endfor %}    hosts:
      - host: "{{ goat_host }}"
        paths:
          - path: "/processes{{ ingress_profile.path_suffix }}"
            pathType: "{{ ingress_profile.pathType }}"
    tls:
      - secretName: "{{ s3_tls_secret_name }}"
        hosts:
          - "{{ goat_host }}"

web:
  enabled: true
  {{ img('web') }}
  auth:
    enabled: true
    existingSecret: goat-keycloak-creds
    publicUrl: "{{ goat_addon.web.public_url }}"
  # NextAuth runs server-side inside the pod and calls Keycloak over HTTPS.
  # On local/dev with a self-signed CA, Node rejects the cert unless we
  # point NODE_EXTRA_CA_CERTS at the bundle mounted below.
  extraEnv:
    - name: NODE_EXTRA_CA_CERTS
      value: /etc/ssl/civitas/ca.crt
    # Browser-side: goat-web's SPA calls each backend directly. entrypoint.sh
    # substitutes APP_NEXT_PUBLIC_* placeholders in the bundle at start.
    # All four URLs share goat_host — the path suffix routes to the right
    # backend via ingress.
    #
    # TRAILING-SLASH ASYMMETRY (do not "normalise", it is load-bearing):
    #
    # - NEXT_PUBLIC_API_URL is consumed as `new URL("api/v2/...", base)`
    #   (lib/api/organizations.ts:13 and ~20 similar sites). The relative
    #   part has no leading slash, so RFC 3986 resolution drops everything
    #   after the last `/` in the base. Without the trailing slash,
    #   `.../core` becomes `.../api/v2/...` — the request lands on goat-web
    #   and returns an HTML 404 with no error logged anywhere. MUST end
    #   in `/`.
    #
    # - The other three are string-concatenated with an explicit leading
    #   slash (`${GEOAPI_BASE_URL}/collections`, `${PROCESSES_BASE_URL}/jobs`).
    #   NEXT_PUBLIC_APP_URL additionally feeds NEXTAUTH_URL, which rejects
    #   a trailing `/` (would produce `//` in the callback path and 404).
    #   MUST NOT end in `/`.
    - name: NEXT_PUBLIC_API_URL
      value: "https://{{ goat_host }}/core/"
    - name: NEXT_PUBLIC_APP_URL
      value: "https://{{ goat_host }}"
    - name: NEXT_PUBLIC_GEOAPI_URL
      value: "https://{{ goat_host }}/geoapi"
    - name: NEXT_PUBLIC_PROCESSES_URL
      value: "https://{{ goat_host }}/processes"
  extraVolumes:
    - name: civitas-ca
      configMap:
        name: civitas-ca
        optional: true
  extraVolumeMounts:
    - name: civitas-ca
      mountPath: /etc/ssl/civitas
      readOnly: true
  # goat-web at the host root. Next.js basePath is build-time (not set in
  # this image's next.config.js), so serving under a subpath is impossible
  # without a fork — hence web takes /.
  ingress:
    enabled: true
    className: "{{ inv_k8s.ingress_class }}"
    annotations:
      cert-manager.io/cluster-issuer: "{{ inv_k8s.cert_manager.issuer_name }}"
      kubernetes.io/ingress.class: "{{ inv_k8s.ingress_class }}"
{% if is_nginx %}      nginx.ingress.kubernetes.io/ssl-redirect: "true"
{% endif %}    hosts:
      - host: "{{ goat_host }}"
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: "{{ s3_tls_secret_name }}"
        hosts:
          - "{{ goat_host }}"
    # KNOWN GOTCHA: Next.js serves /_next/static/chunks/*.js with
    # `cache-control: immutable`. entrypoint.sh sed-substitutes NEXT_PUBLIC_*
    # placeholders at pod start, mutating bytes WITHOUT changing chunk
    # filenames — so browsers that loaded the page before the substitution
    # was complete (or any future NEXT_PUBLIC_* config change) will keep
    # serving stale pre-substitution bytes forever. Civitas's ingress-nginx
    # has `allow-snippet-annotations: false` cluster-wide, so we cannot
    # override the Cache-Control header here. Workaround: clear site data
    # in DevTools after any NEXT_PUBLIC_* change. Long-term fix belongs
    # upstream in the GOAT image (regenerate chunk hashes post-sed).

postgresql:
  operator:
    enabled: false       # civitas has Zalando operator cluster-wide
  cluster:
    enabled: false
  external:
    host: "{{ goat_addon.db.central_db_name }}.{{ goat_addon.db.central_db_ns }}.svc.cluster.local"
    port: 5432
    database: "{{ goat_addon.db.goat_db_name }}"
    existingSecret: goat-postgres-creds
    existingSecretUserKey: username
    existingSecretPasswordKey: password
    sslMode: prefer

redis:
  enabled: true          # bundled — light dep, fine inside civitas
  # Bitnami's free images moved to `bitnamilegacy` registry in Aug 2025;
  # reference goes through software_references.yml for mirror-friendliness.
  image:
    registry: "{{ goat_addon_software.images.redis.registry }}"
    repository: "{{ goat_addon_software.images.redis.repository }}"
    tag: "{{ goat_addon_software.images.redis.tag }}"

# Windmill: server + four workers (default, tools, workflows, print). The
# chart's default `nodeSelector: { server-usage: geodata }` on tools/workflows
# is cleared here — civitas's local clusters don't carry that taint. Bootstrap
# (workspace + API token) is a chart post-install hook.
#
# Dedicated `windmill` database provisioned by 01_db.yml (alongside the
# `goat` DB) — we do NOT share the goat DB (windmill's migrations write
# ~100 tables and need role-creation privileges the goat user doesn't
# have).
windmill:
  db:
    reuseGoatConnection: false
    external:
      host: "{{ goat_addon.db.central_db_name }}.{{ goat_addon.db.central_db_ns }}.svc.cluster.local"
      port: 5432
      database: "{{ goat_addon.db.windmill_db_name }}"
      existingSecret: windmill-postgres-creds
      existingSecretUserKey: username
      existingSecretPasswordKey: password
  # Sync goatlib's bundled tools + tasks into the workspace on each install.
  # Uses the `windmill-worker-tools` image (~larger than python:3.11-slim);
  # acceptable since it runs as a one-shot post-install hook.
  scriptSync:
    enabled: true
  server:
    enabled: true
    image:
      registry: "{{ goat_addon_software.images.windmill_server.registry }}"
      repository: "{{ goat_addon_software.images.windmill_server.repository }}"
      tag: "{{ goat_addon_software.images.windmill_server.tag }}"
      pullPolicy: "{{ goat_addon_software.images.windmill_server.pullPolicy | default('IfNotPresent') }}"
    # BASE_URL drives windmill's outbound links (emails, webhooks, the
    # `Open in Windmill` button). Windmill cannot be served under a subpath,
    # and `processes` reaches it in-cluster via WINDMILL_URL below, so it
    # has no public ingress. Point BASE_URL at the in-cluster service so
    # links that windmill generates internally are at least resolvable
    # from other pods — anything mailed outside the cluster is a dead link.
    config:
      MODE: "server"
      BASE_URL: "http://goat-windmill-server"
    ingress:
      enabled: false
  # Each goatlib-running worker (tools/workflows/print) needs the application
  # DB + S3 + DuckLake config on its env. We rely on chart v0.3.7's renamed
  # internal vars (_WMILL_DB_*) leaving the POSTGRES_* namespace free for
  # the goat DB; and on WHITELIST_ENVS in each worker's config so windmill
  # exposes the env to user scripts at runtime. Non-sensitive values go in
  # `config:` (configmap envFrom); secret refs go in `extraEnv:`.
  workers:
    default:
      enabled: true
      image:
        registry: "{{ goat_addon_software.images.windmill_worker_default.registry }}"
        repository: "{{ goat_addon_software.images.windmill_worker_default.repository }}"
        tag: "{{ goat_addon_software.images.windmill_worker_default.tag }}"
        pullPolicy: "{{ goat_addon_software.images.windmill_worker_default.pullPolicy | default('IfNotPresent') }}"
    # `tools` and `workflows` share the windmill-worker-tools image — heavier
    # (goatlib + geospatial deps). They run python scripts that import
    # goatlib, which the default worker image doesn't ship.
    tools:
      enabled: true
      image:
        registry: "{{ goat_addon_software.images.windmill_worker_tools.registry }}"
        repository: "{{ goat_addon_software.images.windmill_worker_tools.repository }}"
        tag: "{{ goat_addon_software.images.windmill_worker_tools.tag }}"
        pullPolicy: "{{ goat_addon_software.images.windmill_worker_tools.pullPolicy | default('IfNotPresent') }}"
      # Override chart default `node.kubernetes.io/server-usage: geodata`
      # which civitas's local clusters don't carry.
      nodeSelector: {}
      tolerations: []
      # Mount the shared DuckLake PVC so writes here are visible to geoapi
      # (and workflows). Provisioned by 05_minio.yml as `goat-ducklake-data`
      # against inv_k8s.storage_class.rwx — RWX in production, local-path
      # with same-node co-scheduling in dev.
      persistence:
        enabled: true
        existingClaim: goat-ducklake-data
      config:
        MODE: "worker"
        WORKER_GROUP: "tools"
        WORKER_TAGS: "tools"
        WHITELIST_ENVS: "POSTGRES_SERVER,POSTGRES_PORT,POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD,S3_PROVIDER,S3_ENDPOINT_URL,S3_PUBLIC_ENDPOINT_URL,S3_REGION,S3_BUCKET_NAME,S3_ACCESS_KEY_ID,S3_SECRET_ACCESS_KEY,DUCKLAKE_CATALOG_SCHEMA,DUCKLAKE_DATA_DIR,CUSTOMER_SCHEMA"
        POSTGRES_SERVER: "{{ goat_addon.db.central_db_name }}.{{ goat_addon.db.central_db_ns }}.svc.cluster.local"
        POSTGRES_PORT: "5432"
        POSTGRES_DB: "{{ goat_addon.db.goat_db_name }}"
        S3_PROVIDER: "{{ s3_provider }}"
        S3_ENDPOINT_URL: "{{ s3_internal_endpoint }}"
        S3_PUBLIC_ENDPOINT_URL: "{{ s3_public_endpoint }}"
        S3_REGION: "{{ s3_region }}"
        S3_BUCKET_NAME: "{{ goat_addon.s3.bucket }}"
        DUCKLAKE_CATALOG_SCHEMA: "ducklake"
        DUCKLAKE_DATA_DIR: "/app/data/ducklake"
        CUSTOMER_SCHEMA: "customer"
      extraEnv:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef: { name: goat-postgres-creds, key: username }
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef: { name: goat-postgres-creds, key: password }
        - name: S3_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef: { name: minio-credentials, key: access_key }
        - name: S3_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef: { name: minio-credentials, key: secret_key }
    workflows:
      enabled: true
      image:
        registry: "{{ goat_addon_software.images.windmill_worker_tools.registry }}"
        repository: "{{ goat_addon_software.images.windmill_worker_tools.repository }}"
        tag: "{{ goat_addon_software.images.windmill_worker_tools.tag }}"
        pullPolicy: "{{ goat_addon_software.images.windmill_worker_tools.pullPolicy | default('IfNotPresent') }}"
      nodeSelector: {}
      tolerations: []
      persistence:
        enabled: true
        existingClaim: goat-ducklake-data
      config:
        MODE: "worker"
        WORKER_GROUP: "workflows"
        WORKER_TAGS: "workflows"
        WHITELIST_ENVS: "POSTGRES_SERVER,POSTGRES_PORT,POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD,S3_PROVIDER,S3_ENDPOINT_URL,S3_PUBLIC_ENDPOINT_URL,S3_REGION,S3_BUCKET_NAME,S3_ACCESS_KEY_ID,S3_SECRET_ACCESS_KEY,DUCKLAKE_CATALOG_SCHEMA,DUCKLAKE_DATA_DIR,CUSTOMER_SCHEMA"
        POSTGRES_SERVER: "{{ goat_addon.db.central_db_name }}.{{ goat_addon.db.central_db_ns }}.svc.cluster.local"
        POSTGRES_PORT: "5432"
        POSTGRES_DB: "{{ goat_addon.db.goat_db_name }}"
        S3_PROVIDER: "{{ s3_provider }}"
        S3_ENDPOINT_URL: "{{ s3_internal_endpoint }}"
        S3_PUBLIC_ENDPOINT_URL: "{{ s3_public_endpoint }}"
        S3_REGION: "{{ s3_region }}"
        S3_BUCKET_NAME: "{{ goat_addon.s3.bucket }}"
        DUCKLAKE_CATALOG_SCHEMA: "ducklake"
        DUCKLAKE_DATA_DIR: "/app/data/ducklake"
        CUSTOMER_SCHEMA: "customer"
      extraEnv:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef: { name: goat-postgres-creds, key: username }
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef: { name: goat-postgres-creds, key: password }
        - name: S3_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef: { name: minio-credentials, key: access_key }
        - name: S3_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef: { name: minio-credentials, key: secret_key }
    print:
      enabled: true
      image:
        registry: "{{ goat_addon_software.images.windmill_worker_print.registry }}"
        repository: "{{ goat_addon_software.images.windmill_worker_print.repository }}"
        tag: "{{ goat_addon_software.images.windmill_worker_print.tag }}"
        pullPolicy: "{{ goat_addon_software.images.windmill_worker_print.pullPolicy | default('IfNotPresent') }}"
      nodeSelector: {}

caddy:
  enabled: false         # goat-web has its own Ingress (above) — no proxy needed
