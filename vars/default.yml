# /home/p4b/civitas-goat-addon/vars/default.yml
---
addon_dir: "addons/goat_addon/"

# Composed once at the top level, deliberately OUTSIDE `goat_addon`. If
# `goat_addon.db.host`'s default composed this FQDN inline from
# `goat_addon.db.central_db_name`, Ansible would resolve one key of
# `goat_addon` while templating a sibling key of `goat_addon` and raise
# `recursive loop detected in template string` — the sibling `minio_addon`
# has already been bitten by exactly that shape with `inv_op_stack`. Hoisting
# the FQDN out of `goat_addon` breaks the cycle.
goat_central_db_fqdn: "{{ (inv_addons.goat.db.central_db_name | default('central-db')) + '.' + inv_central_db.ns_name + '.svc.cluster.local' }}"

goat_addon:
  namespace: "{{ inv_addons.goat.namespace | default(ENVIRONMENT + '-goat-stack') }}"
  # Civitas conventions: every stack declares whether it creates its own
  # namespace and which kubeconfig it talks to. `ns_kubeconfig` is resolved
  # against K8S_KUBECONFIG_PATH in 00_namespace.yml, exactly as inv_op_stack /
  # inv_gd / inv_datacatalog do.
  ns_create: "{{ inv_addons.goat.ns_create | default(true) }}"
  ns_kubeconfig: "{{ inv_addons.goat.ns_kubeconfig | default(kubeconfig_file) }}"
  # Chart + image refs. Default `ref` points at the pre-fetched chart tarball
  # shipped with this addon at `files/goat-<version>.tgz` — makes the addon
  # offline-installable out of the box (air-gapped deployments) and avoids the
  # ghcr.io private-package auth path entirely. The filename is built from
  # `chart.version` below, so bumping the bundled chart is: drop a new
  # `.tgz` into `files/`, bump the version pin in vars/software_references.yml
  # (or override `inv_addons.goat.chart.version` from inventory).
  # To pull remotely instead, set `inv_addons.goat.chart.ref` in inventory
  # to an `oci://…` URL (e.g. `oci://ghcr.io/plan4better/charts/goat`).
  chart:
    ref: "{{ inv_addons.goat.chart.ref | default(addon_dir + 'files/goat-' + (inv_addons.goat.chart.version | default(software.addon_goat.helm_chart_version)) + '.tgz') }}"
    version: "{{ inv_addons.goat.chart.version | default(software.addon_goat.helm_chart_version) }}"
  db:
    central_db_ns: "{{ inv_central_db.ns_name }}"
    # Zalando cluster NAME — not an endpoint. `tasks/01_db.yml` derives the
    # operator's per-DB credential Secret names from this
    # (`<db>-owner-user.<cluster>.credentials.postgresql.acid.zalan.do`) and
    # runs its `psql` provisioning calls via `k8s_exec` inside the master
    # pod. It must therefore stay the Zalando cluster name even when
    # workloads are pointed at a pooler.
    central_db_name: "{{ inv_addons.goat.db.central_db_name | default('central-db') }}"
    # Postgres endpoint that the *workloads* dial (goat-core, geoapi,
    # processes, windmill workers, DuckLake bootstrap). Deliberately
    # separate from `central_db_name`: the default resolves to the Zalando
    # master service, but overriding to
    # `central-db-pooler.<ns>.svc.cluster.local` routes runtime traffic
    # through the operator's pgbouncer instead. Database provisioning is
    # unaffected — `01_db.yml` never reads `host`/`port`.
    host: "{{ inv_addons.goat.db.host | default(goat_central_db_fqdn) }}"
    port: "{{ inv_addons.goat.db.port | default(5432) | int }}"
    # Windmill-only escape hatch, defaults to `host`/`port`. The Zalando
    # operator's pooler runs pgbouncer in TRANSACTION mode by default;
    # windmill talks to Postgres through sqlx with server-side prepared
    # statements plus its own migrations, and prepared statements only work
    # under transaction pooling on pgbouncer >= 1.21 with
    # `max_prepared_statements` set non-zero. Leave unset to follow `host`;
    # pin back to the direct service if windmill misbehaves while the rest
    # of the stack stays pooled. Nested `default()` on purpose — chaining
    # `| default | default` would silently pick the wrong fallback when
    # `host` is set but `windmill_host` is not.
    windmill_host: "{{ inv_addons.goat.db.windmill_host | default(inv_addons.goat.db.host | default(goat_central_db_fqdn)) }}"
    windmill_port: "{{ inv_addons.goat.db.windmill_port | default(inv_addons.goat.db.port | default(5432)) | int }}"
    # Geoapi-only escape hatch, defaults to `host`/`port`. WORKAROUND:
    # `apps/geoapi/src/geoapi/services/layer_service.py:_create_pool` passes a
    # hardcoded `server_settings={"tcp_keepalives_idle": ..., "…_interval": ...,
    # "…_count": ...}` to `asyncpg.create_pool`. asyncpg forwards those as
    # Postgres startup parameters, and pgbouncer rejects any startup parameter
    # outside `ignore_startup_parameters` — the Zalando pooler image hardcodes
    # that list in its config template with no supported override, so geoapi
    # raises `ProtocolViolationError: unsupported startup parameter:
    # tcp_keepalives_idle` at startup when routed via the pooler. The dict is
    # a literal with no config indirection, so no env var can disable it.
    # Pin `geoapi_host` at the direct Zalando master service
    # (`central-db.<ns>.svc.cluster.local`) to bypass the pooler for geoapi
    # only; leave unset to follow `host`. Remove once geoapi makes those
    # settings configurable or drops them upstream.
    # COST: bypassing the pooler here costs up to 10 direct connections per
    # geoapi replica (`asyncpg` pool is `min_size=2, max_size=10`, hardcoded
    # in the same `_create_pool` call). Keep `geoapi.replicaCount` low when
    # this override points at the direct service.
    # Nested `default()` on purpose — chaining `| default | default` would
    # silently pick the wrong fallback when `host` is set but `geoapi_host`
    # is not.
    geoapi_host: "{{ inv_addons.goat.db.geoapi_host | default(inv_addons.goat.db.host | default(goat_central_db_fqdn)) }}"
    geoapi_port: "{{ inv_addons.goat.db.geoapi_port | default(inv_addons.goat.db.port | default(5432)) | int }}"
    # DB names. Defaults match upstream compose / chart conventions. Vary if
    # you need to co-tenant two installs in the same Postgres cluster — but
    # note windmill's *role names* (windmill_admin, windmill_user) are
    # hardcoded by its migrations regardless of DB name, so two installs
    # sharing one cluster would still collide on roles.
    goat_db_name: "{{ inv_addons.goat.db.goat_db_name | default('goat') }}"
    windmill_db_name: "{{ inv_addons.goat.db.windmill_db_name | default('windmill') }}"
  keycloak:
    # Client ID created in the civitas Keycloak realm. Defaults to `goat-web`,
    # matching the convention used by plan4better's standalone infra.
    client_id: "{{ inv_addons.goat.keycloak.client_id | default('goat-web') }}"
  # Master switches for the two exposure mechanisms. `enable_ingress: true`
  # is the historical default (Ingress on all four chart services + MinIO).
  # `enable_gateway: true` deploys a Gateway + HTTPRoute instead of / in
  # addition to the Ingress path — used on clusters that run a Gateway-API
  # controller (NGINX Gateway Fabric, Traefik >= v3). Both can be `true`
  # temporarily during a migration; production should pick one.
  enable_ingress: "{{ inv_addons.goat.enable_ingress | default(true) | bool }}"
  enable_gateway: "{{ inv_addons.goat.enable_gateway | default(false) | bool }}"
  web:
    # Subdomain used to compose BOTH the ingress hostname and the public
    # (browser-facing) URL. Reverse-proxy topology: when there is no proxy,
    # DOMAIN == INGRESS_DOMAIN and the two hostnames coincide; behind a
    # proxy, DOMAIN is the browser-facing zone while
    # INGRESS_DOMAIN is the internal ingress-visible one. The default falls
    # `INGRESS_DOMAIN` back to `DOMAIN` so single-hostname setups keep
    # working without touching the inventory.
    subdomain: "{{ inv_addons.goat.web.subdomain | default('goat') }}"
    # Public URL of the GOAT web frontend. Speeds `NEXT_PUBLIC_*` /
    # `NEXTAUTH_URL` / Keycloak `redirectUris` / `S3_PUBLIC_ENDPOINT_URL` —
    # the URL the browser sees, NOT the ingress host. Default composes it
    # from `subdomain` + `DOMAIN`; override in inventory if you need a
    # different public URL than `<subdomain>.<DOMAIN>`.
    public_url: "{{ inv_addons.goat.web.public_url | default('https://' + (inv_addons.goat.web.subdomain | default('goat')) + '.' + DOMAIN) }}"
  s3:
    # Bucket name. DuckLake parquet files + uploaded assets land here. Same
    # key regardless of whether the object store is the in-cluster MinIO
    # (default) or an external S3-compatible endpoint (see `mode` below).
    bucket: "{{ inv_addons.goat.s3.bucket | default('goat') }}"
    # Deployment mode:
    #   * `in_cluster` (default) — the addon deploys a single-replica MinIO
    #     in the goat namespace (Deployment + PVC + Service + Ingress) and
    #     generates root credentials. Fine for local/dev; not HA.
    #   * `external` — the addon skips every in-namespace MinIO resource and
    #     points every S3-consuming service (goat-core, geoapi, processes,
    #     both windmill workers, DuckLake bootstrap) at `endpoint` below.
    #     Works for any S3-compatible service: a pre-existing MinIO
    #     elsewhere in the cluster, Cloudflare R2, Wasabi, Backblaze B2, or
    #     real AWS S3 — see `provider` / `force_path_style` for AWS.
    #
    # Preconditions when mode == 'external':
    #   * `access_key` + `secret_key` non-empty (below). The addon
    #     materializes them into a `goat-s3-credentials` Secret in
    #     goat_addon.namespace — keep the source values in ansible-vault.
    #   * `endpoint` set below.
    #   * The endpoint is reachable from the goat namespace.
    #   * SigV4 `region` matches how the target signs.
    #   * If `force_path_style: true` (default), the endpoint must support
    #     path-style S3.
    mode: "{{ inv_addons.goat.s3.mode | default('in_cluster') }}"
    # External-mode endpoint. Ignored when mode == 'in_cluster'. Only
    # the cluster-internal endpoint is configured — the browser-facing
    # S3 URL is ALWAYS `goat_public_url` in both modes (the addon runs
    # a `/<bucket>` Ingress that proxies to an ExternalName service
    # pointing at this endpoint), so there is no `public_endpoint`
    # variable to keep in sync.
    endpoint: "{{ inv_addons.goat.s3.endpoint | default('') }}"
    # External-mode credentials. Required (non-empty) when mode == 'external';
    # ignored when mode == 'in_cluster' (the addon generates its own creds).
    # Keep the source values in ansible-vault; the addon writes them into the
    # `goat-s3-credentials` Secret in goat_addon.namespace on every run.
    access_key: "{{ inv_addons.goat.s3.access_key | default('') }}"
    secret_key: "{{ inv_addons.goat.s3.secret_key | default('') }}"
    # Runtime S3 settings — applied in both modes.
    region: "{{ inv_addons.goat.s3.region | default('us-east-1') }}"
    # `S3_PROVIDER` passed to goat-core / geoapi / processes / windmill
    # workers. Default `minio` matches historical behavior. Set `aws` for
    # real AWS S3 (goat-core's config.py branches on this).
    provider: "{{ inv_addons.goat.s3.provider | default('minio') }}"
    # Path-style vs virtual-hosted-style S3 URLs. Kept as a native bool
    # here; templates stringify at the point of use. MinIO / R2 / Wasabi /
    # Backblaze support path-style — keep true. AWS S3 has been deprecating
    # path-style since 2020 and buckets created after that in some regions
    # require virtual-hosted-style — set false.
    force_path_style: "{{ inv_addons.goat.s3.force_path_style | default(true) | bool }}"
    # Tunables for the `/<bucket>` passthrough Ingress (05_minio.yml).
    # Applied in both `in_cluster` and `external` modes so the browser
    # can PUT presigned objects at `<goat_public_url>/<bucket>/…` without
    # hitting the default 1 MB body limit or default 60s upstream timeouts.
    proxy:
      # Upload size cap. ingress-nginx default is 1 MB, which 413s every
      # real GPKG immediately. 5g matches the historical hardcoded value
      # on the s3.goat.<DOMAIN>-ingress on main.
      max_body_size: "{{ inv_addons.goat.s3.proxy.max_body_size | default('5g') }}"
      # Buffer the request body on the ingress pod before proxying it to
      # the upstream. Default `on` — with `off`, nginx streams the body
      # as it arrives; if the S3 upstream rejects the request early (4xx
      # on a bad signature, exceeded quota, missing bucket, …) and
      # closes without draining the body, the TCP RST from that close
      # propagates back through nginx as a 502 and the real 4xx status
      # is lost. The symptom is non-deterministic: whether the browser
      # sees the actual S3 error depends on a race between how much of
      # the body already reached the upstream and how quickly the
      # upstream closed — same signed URL, same file, one attempt shows
      # 403 and the next shows 502. Only flip to `off` when very large
      # uploads make disk buffering on the ingress pod untenable and
      # the diagnostic downside is a conscious trade-off.
      request_buffering: "{{ inv_addons.goat.s3.proxy.request_buffering | default('on') }}"
      # nginx-only: verify the upstream TLS certificate.
      # NOTE: with the addon's default configuration this annotation is a
      # no-op. ingress-nginx's template only renders `proxy_ssl_verify`
      # when `ProxySSL.CAFileName` is non-empty, and that is populated
      # from the `proxy-ssl-secret` annotation (a client-CA Secret) which
      # the addon does not provision. Kept as a plumbing hook for future
      # setups that wire in a `proxy-ssl-secret`. Defaults to `false`
      # (no verify) so the intent stays consistent with the internal-CA
      # / self-signed endpoints operator-run clusters ship with. Only
      # consulted when `s3.endpoint` is `https://`.
      ssl_verify: "{{ inv_addons.goat.s3.proxy.ssl_verify | default(false) | bool }}"
      # SNI hostname sent by ingress-nginx to the upstream during the
      # TLS handshake. Default (empty) → 05_minio.yml derives it from
      # `s3.endpoint`'s hostname. ingress-nginx's built-in default is
      # `$proxy_host`, which under its dynamic-upstream architecture is
      # the literal string `upstream_balancer` — no S3 endpoint serves
      # a cert for that name, so name-based-virtual-hosted endpoints
      # (R2, CDN-fronted MinIO, some managed S3) refuse the handshake.
      # Only consulted when `s3.endpoint` is `https://`.
      ssl_name: "{{ inv_addons.goat.s3.proxy.ssl_name | default('') }}"
      # `Host` header sent to the upstream on the /<bucket> Ingress:
      #   * unset (Ansible None)  → 05_minio.yml substitutes
      #     `goat_public_host` (browser-facing name; SigV4 signs this
      #     host on presigned GETs, so pods must see the same value)
      #   * "" (empty string)     → the upstream-vhost annotation is
      #     omitted entirely and ingress-nginx forwards the Host header
      #     the client sent verbatim (pass-through)
      #   * any other string      → literal upstream-vhost value
      # The three-state semantics allow overriding to a custom host or
      # opting out of the rewrite altogether without deleting the vars
      # entry.
      upstream_vhost: "{{ inv_addons.goat.s3.proxy.upstream_vhost | default(None) }}"
      # Retry a failing upstream request against the next endpoint in the
      # backend on the listed failure classes. `non_idempotent` is
      # load-bearing here — without it, ingress-nginx will NOT retry a
      # POST (or PUT) that arrived on a stale keepalive connection to the
      # upstream, so a browser upload lands on a half-closed socket and
      # returns 502 instead of retrying against a fresh connection.
      next_upstream: "{{ inv_addons.goat.s3.proxy.next_upstream | default('error timeout non_idempotent') }}"
      next_upstream_tries: "{{ inv_addons.goat.s3.proxy.next_upstream_tries | default('2') }}"
  ducklake:
    pvc_size: "{{ inv_addons.goat.ducklake.pvc_size | default('20Gi') }}"
    # RWX for real multi-node clusters; local-path (k3d/k3s default) cannot
    # provision RWX — set ReadWriteOnce there (sharing then relies on
    # co-scheduling, see README).
    pvc_access_mode: "{{ inv_addons.goat.ducklake.pvc_access_mode | default('ReadWriteMany') }}"
    # Storage class for the shared DuckLake PVC. Defaults to
    # `inv_k8s.storage_class.rwx` (the cluster-wide RWX class), but the
    # addon accepts an override here so operators can point at a CephFS /
    # NFS class without moving the global `inv_k8s.storage_class.rwx` off
    # whatever RWO-appropriate class the rest of civitas uses. See the
    # RWX preflight in tasks/05_minio.yml — a block-backed class (Ceph
    # RBD, EBS, GCE PD, Azure Disk) cannot satisfy ReadWriteMany and the
    # PVC will sit Pending indefinitely with only a generic
    # `waiting for external provisioner` event.
    storage_class: "{{ inv_addons.goat.ducklake.storage_class | default(inv_k8s.storage_class.rwx) }}"
  # Ingress routing profile — controller-specific handling for the two
  # services that DO NOT support FastAPI `root_path`: geoapi and processes.
  # /core, /, /<bucket> route identically on every controller (goat-core
  # carries its own prefix via API_V2_STR; goat-web sits at the host root;
  # MinIO's path equals the bucket name, no rewrite). Selected by
  # `inv_k8s.ingress_class`; an assert in tasks.yml catches unknown values.
  #
  # STRATEGIC NOTE: this abstraction exists only because geoapi/processes
  # emit absolute URLs from `request.base_url` without the ingress prefix,
  # and FastAPI's `root_path` support is missing upstream. When the
  # ROOT_PATH change lands in plan4better/goat, both services can serve
  # under their own prefix like goat-core already does, and the whole
  # profile map + Middleware CRDs + conditional annotations can be
  # deleted in favour of plain `Prefix` paths.
  #
  # Additive by design: adding e.g. APISIX means adding an `apisix:` key
  # under `profiles`, not another elif branch.
  ingress:
    # Traefik Middleware CRD API group. `traefik.io/v1alpha1` = Traefik v3
    # (current default); `traefik.containo.us/v1alpha1` = Traefik v2. The
    # CRD name is the same across versions; only the API group differs.
    # Detection at runtime is possible but adds a k8s_info lookup per
    # run — expose as a plain override instead and default to v3.
    traefik_api_group: "{{ inv_addons.goat.ingress.traefik_api_group | default('traefik.io/v1alpha1') }}"
    # `configuration-snippet` annotations require ingress-nginx to run with
    # `allow-snippet-annotations: true` in the controller ConfigMap. Since
    # ingress-nginx 1.9 the upstream default is `false`, and civitas
    # historically shipped `false` cluster-wide too. The staging cluster
    # this addon targets has it flipped to `true`, so we allow opting in
    # per-tenant. When `true`, goat-web's ingress gets a
    # `configuration-snippet` that rewrites `X-Forwarded-Host` to the
    # public hostname — Next.js Server Actions validate `Origin` against
    # `Host`/`X-Forwarded-Host`, and without this rewrite the two would
    # disagree behind a reverse proxy ("Invalid Server Actions request").
    # `upstream-vhost` (a plain annotation) is always set and covers the
    # Host-header rewrite on its own; the snippet only adds the
    # `X-Forwarded-Host` override.
    allow_snippets: "{{ inv_addons.goat.ingress.allow_snippets | default(false) | bool }}"
    profiles:
      nginx:
        # ingress-nginx: annotation-driven regex rewrite. `use-regex: true`
        # enables the regex path matcher; `rewrite-target: /$2` strips the
        # ingress prefix by rewriting to the captured tail before proxy.
        path_suffix: "(/|$)(.*)"
        pathType: "ImplementationSpecific"
        annotations:
          nginx.ingress.kubernetes.io/rewrite-target: "/$2"
          nginx.ingress.kubernetes.io/use-regex: "true"
        # No CRDs — nginx rewrites inline.
        needs_middleware: false
      traefik:
        # Traefik has no regex path matcher and no annotation that
        # rewrites the request path. Prefix stripping requires a
        # `stripPrefix` Middleware CRD (created by
        # tasks/04_ingress_middleware.yml) referenced from each ingress
        # via `router.middlewares`. Traefik's stripPrefix additionally
        # sets X-Forwarded-Prefix on the upstream — nothing in GOAT reads
        # it today, but it is what the upstream ROOT_PATH work would use.
        # The annotation format `<namespace>-<name>@kubernetescrd` is
        # mandatory and fails silently if wrong.
        path_suffix: ""
        pathType: "Prefix"
        annotations: {}
        needs_middleware: true
  # Windmill workspace + admin password rotation are handled by the chart
  # itself (post-install hook, since chart v0.3.4). The addon doesn't need
  # any windmill-app config — just point processes at the chart-managed
  # token Secret (`goat-windmill-token`) in templates/goat_values.yml.
  health_check:
    retries: 30
    delay_seconds: 10
