# /home/p4b/civitas-goat-addon/tasks/05_minio.yml
---
# geoapi (and the chart's `processes` service when enabled) need S3-compatible
# object storage to back the DuckLake data files. Two modes:
#
#   * DEFAULT — this file deploys a minimal single-replica MinIO inside the
#     goat namespace (bucket + credentials + public ingress). Mirrors
#     plan4better's compose.yaml topology. Fine for local/dev; not HA, not
#     for prod scale. The GOAT chart doesn't ship MinIO (planned for chart
#     Phase 2/3 per Chart.yaml), and civitas-core doesn't have a cluster-wide
#     object store either.
#
#   * EXTERNAL — when `goat_addon.s3.mode == 'external'`, every "MinIO
#     server" block below is skipped, the bucket-init Job is skipped
#     (external credentials typically lack `s3:CreateBucket` — the
#     operator provisions the bucket out-of-band), and only the
#     ducklake-init Job runs, retargeted at the given endpoint to write
#     the DuckLake catalog into the existing bucket.
#     Works for any S3-compatible service: an existing MinIO elsewhere in
#     the cluster, Cloudflare R2, Wasabi, Backblaze B2, or real AWS S3.
#     Preconditions: bucket already exists at the target endpoint;
#     `goat_addon.s3.access_key` / `secret_key` set (from ansible-vault —
#     the addon materializes them into the `goat-s3-credentials` Secret
#     in the goat namespace on every run); endpoint reachable from the
#     goat namespace; SigV4 region matches; path-style S3 unless
#     `force_path_style: false`. See README §External S3.

# Shared DuckLake data volume. layer_import (worker-tools) writes parquet
# under /app/data/ducklake/...; geoapi reads it for tile serving. Both must
# see the same files — hence one PVC mounted on tools/workflows/geoapi via
# the chart's existingClaim wiring + extraVolumes (goat_values.yml).
#
# Storage class: `goat_addon.ducklake.storage_class` — defaults to
# `inv_k8s.storage_class.rwx` (the cluster-wide RWX class). The addon
# accepts an override so operators can point at a CephFS / NFS class
# without moving the global off whatever the rest of civitas uses. See
# README "Known caveats" — block-backed classes (Ceph RBD, EBS, GCE PD,
# Azure Disk) cannot satisfy ReadWriteMany and leave the PVC Pending
# indefinitely; `local-path` (RWO-only) works single-node but silently
# fragments per-node and causes empty-tile symptoms on multi-node.
- name: "GOAT addon: create shared DuckLake data PVC"
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: goat-ducklake-data
        namespace: "{{ goat_addon.namespace }}"
        labels:
          app.kubernetes.io/managed-by: civitas-goat-addon
      spec:
        accessModes:
          # RWX for real multi-node clusters; local-path (k3d/k3s default)
          # cannot provision RWX — set pvc_access_mode: ReadWriteOnce there
          # (sharing then relies on co-scheduling, see README).
          - "{{ goat_addon.ducklake.pvc_access_mode | default('ReadWriteMany') }}"
        storageClassName: "{{ goat_addon.ducklake.storage_class }}"
        resources:
          requests:
            storage: "{{ goat_addon.ducklake.pvc_size | default('20Gi') }}"

# Schema preflight. `s3.mode` gates every branch below; fail cleanly on
# unknown values rather than silently taking the default path.
- name: "GOAT addon: preflight — s3.mode is supported"
  ansible.builtin.assert:
    that:
      - goat_addon.s3.mode in ['in_cluster', 'external']
    fail_msg: >-
      goat_addon.s3.mode = '{{ goat_addon.s3.mode }}' but must be one of
      'in_cluster' or 'external'. See vars/default.yml.

# External-mode preflights. Cluster-internal endpoint plus non-empty
# credentials (the addon writes them into the `goat-s3-credentials`
# Secret below). No `public_endpoint` is configured — the browser-facing
# URL is always the public GOAT URL (see the mode-agnostic MinIO ingress
# below + the ExternalName service that stands in for the external S3).
- name: "GOAT addon: preflight — external S3 endpoint config"
  ansible.builtin.assert:
    that:
      - goat_addon.s3.endpoint | length > 0
    fail_msg: >-
      goat_addon.s3.mode = 'external' but endpoint is empty. Set
      inv_addons.goat.s3.endpoint to the cluster-internal S3 URL.
  when: goat_addon.s3.mode == 'external'

- name: "GOAT addon: preflight — external S3 credentials provided"
  ansible.builtin.assert:
    that:
      - goat_addon.s3.access_key | length > 0
      - goat_addon.s3.secret_key | length > 0
    fail_msg: >-
      goat_addon.s3.mode = 'external' but access_key/secret_key are
      empty. Set inv_addons.goat.s3.access_key / secret_key (source them
      from ansible-vault).
  when: goat_addon.s3.mode == 'external'

# Compute the S3 upstream port as a native int and stash it on a fact.
# Rationale: Ansible (without `jinja2_native`) stringifies any `"{{ …
# | int }}"` scalar it renders, so passing the result inline into a k8s
# `definition:` dict yields `port: "9000"` and the API server rejects it
# with `cannot unmarshal string into … ServicePort.spec.ports.port of
# type int32`. `set_fact` stores the raw Python type of a single Jinja
# expression, and Ansible's templar preserves that type for bare
# `"{{ var }}"` references — so we materialise the int here and reference
# it as a bare var at both use sites (ExternalName Service + MinIO
# Ingress backend).
#
# Fallback ladder when the operator's `endpoint` omits an explicit port:
#   * in_cluster mode          → 9000 (the MinIO Service port)
#   * external `https://…`     → 443
#   * external `http://…`      → 80
# Historically we defaulted to 9000 in every external branch too, which
# broke every operator-run endpoint that terminates TLS on the standard
# port and returned `Connection refused` from ingress-nginx.
- name: "GOAT addon: resolve S3 upstream port"
  ansible.builtin.set_fact:
    goat_s3_upstream_port: "{{ 9000 if goat_addon.s3.mode == 'in_cluster' else ((goat_addon.s3.endpoint | urlsplit('port')) | default((443 if goat_addon.s3.endpoint.startswith('https://') else 80), true) | int) }}"

# Whether the S3 upstream speaks TLS. Two callers:
#   * the MinIO Ingress annotations below (nginx `backend-protocol`,
#     `proxy-ssl-verify`; traefik `service.serversscheme`)
#   * the DuckLake / bucket-init Jobs' `S3_USE_SSL` env var
# In `in_cluster` mode the endpoint is always the http:// in-namespace
# Service, so this evaluates to false. In `external` mode it reflects the
# scheme of the operator-supplied endpoint.
- name: "GOAT addon: determine whether S3 upstream uses TLS"
  ansible.builtin.set_fact:
    s3_endpoint_is_tls: "{{ goat_addon.s3.mode == 'external' and goat_addon.s3.endpoint.startswith('https://') }}"

# In-cluster mode reuses credentials across reruns if a prior run left a
# Secret behind — the k8s_info lookup below feeds the reuse branch.
- name: "GOAT addon: check for existing goat-s3-credentials secret"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    api_version: v1
    kind: Secret
    name: goat-s3-credentials
    namespace: "{{ goat_addon.namespace }}"
  register: minio_existing
  when: goat_addon.s3.mode == 'in_cluster'

- name: "GOAT addon: resolve MinIO root credentials"
  block:
    - name: "GOAT addon: use externally-provided S3 credentials"
      ansible.builtin.set_fact:
        minio_access_key: "{{ goat_addon.s3.access_key }}"
        minio_secret_key: "{{ goat_addon.s3.secret_key }}"
      when: goat_addon.s3.mode == 'external'

    - name: "GOAT addon: reuse existing MinIO credentials"
      ansible.builtin.set_fact:
        minio_access_key: "{{ minio_existing.resources[0].data.access_key | b64decode }}"
        minio_secret_key: "{{ minio_existing.resources[0].data.secret_key | b64decode }}"
      when:
        - goat_addon.s3.mode == 'in_cluster'
        - minio_existing.resources | length > 0

    - name: "GOAT addon: generate new MinIO credentials"
      ansible.builtin.set_fact:
        minio_access_key: "goat-{{ lookup('community.general.random_string', length=12, special=false) | lower }}"
        minio_secret_key: "{{ lookup('community.general.random_string', length=40, special=false) }}"
      when:
        - goat_addon.s3.mode == 'in_cluster'
        - minio_existing.resources | length == 0

- name: "GOAT addon: persist MinIO credentials secret"
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: goat-s3-credentials
        namespace: "{{ goat_addon.namespace }}"
        labels:
          app.kubernetes.io/managed-by: civitas-goat-addon
      type: Opaque
      stringData:
        access_key: "{{ minio_access_key }}"
        secret_key: "{{ minio_secret_key }}"

- name: "GOAT addon: deploy MinIO (server + PVC + service)"
  when: goat_addon.s3.mode == 'in_cluster'
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    state: present
    definition: "{{ item }}"
  loop:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: minio-data
        namespace: "{{ goat_addon.namespace }}"
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: "{{ inv_k8s.storage_class.loc | default('local-path') }}"
        resources:
          requests:
            storage: 10Gi
    - apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: minio
        namespace: "{{ goat_addon.namespace }}"
        labels:
          app: minio
          app.kubernetes.io/managed-by: civitas-goat-addon
      spec:
        replicas: 1
        strategy:
          type: Recreate  # single-replica + RWO PVC → can't rolling-update
        selector:
          matchLabels:
            app: minio
        template:
          metadata:
            labels:
              app: minio
          spec:
            containers:
              - name: minio
                image: "{{ software.addon_goat.images.minio.registry }}/{{ software.addon_goat.images.minio.repository }}:{{ software.addon_goat.images.minio.tag }}"
                imagePullPolicy: "{{ software.addon_goat.images.minio.pullPolicy | default('IfNotPresent') }}"
                args: ["server", "--console-address", ":9001", "/data/s3"]
                ports:
                  - { name: api, containerPort: 9000 }
                  - { name: console, containerPort: 9001 }
                env:
                  - name: MINIO_ROOT_USER
                    valueFrom:
                      secretKeyRef:
                        name: goat-s3-credentials
                        key: access_key
                  - name: MINIO_ROOT_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: goat-s3-credentials
                        key: secret_key
                readinessProbe:
                  httpGet: { path: /minio/health/ready, port: 9000 }
                  periodSeconds: 5
                volumeMounts:
                  - { name: data, mountPath: /data }
            volumes:
              - name: data
                persistentVolumeClaim:
                  claimName: minio-data
    - apiVersion: v1
      kind: Service
      metadata:
        name: minio
        namespace: "{{ goat_addon.namespace }}"
      spec:
        selector:
          app: minio
        ports:
          - { name: api, port: 9000, targetPort: 9000 }
          - { name: console, port: 9001, targetPort: 9001 }

# Expose MinIO over HTTPS for browser-side uploads. Goat-core returns
# presigned S3 URLs that the SPA fetches directly — they MUST be HTTPS
# or Chrome mixed-content-blocks them.
#
# The ingress path MUST equal `/` + bucket name. GOAT uses path-style S3
# (`S3_FORCE_PATH_STYLE=true`), so presigned URLs look like
# `<goat_public_url>/<bucket>/<key>?X-Amz-Signature=…`. SigV4 signs the
# canonical URI, so any nginx rewrite that alters the path breaks every
# signature. This ingress therefore adds NO rewrite-target annotation and
# uses the bucket name as its prefix.
#
# Hosts:
#   * goat_ingress_host — the ingress-host (SNI + Host + TLS secret),
#     shared with the chart's four ingresses and with the Certificate in
#     06_certificate.yml. The MinIO Ingress terminates TLS on this name.
#   * goat_public_url — what the browser sees. Substituted into
#     S3_PUBLIC_ENDPOINT_URL (rendered in the chart values); presigned URLs
#     the browser follows point at this URL.
#   * goat_public_host — the bare host derived from `goat_public_url`
#     (no scheme, no trailing slash). Used as `upstream-vhost` on the
#     MinIO Ingress so the pod sees `Host: <public host>` — SigV4 signs
#     the host on presigned GETs and would otherwise fail with
#     `SignatureDoesNotMatch` when a fronting reverse proxy rewrites the
#     Host header to the internal ingress name.
- name: "GOAT addon: derive goat ingress + public + S3 ingress path from inventory"
  ansible.builtin.set_fact:
    goat_subdomain: "{{ goat_addon.web.subdomain | default('goat') }}"
    goat_ingress_host: "{{ (goat_addon.web.subdomain | default('goat')) + '.' + (INGRESS_DOMAIN | default(DOMAIN)) }}"
    goat_public_url: "{{ goat_addon.web.public_url | default('https://' + (goat_addon.web.subdomain | default('goat')) + '.' + DOMAIN) }}"
    goat_public_host: "{{ (goat_addon.web.public_url | default('https://' + (goat_addon.web.subdomain | default('goat')) + '.' + DOMAIN)) | regex_replace('^https?://', '') | regex_replace('/+$', '') }}"
    goat_tls_secret: "{{ (goat_addon.web.subdomain | default('goat')) + '.' + (INGRESS_DOMAIN | default(DOMAIN)) }}-tls"
    s3_ingress_path: "/{{ goat_addon.s3.bucket }}"

# Resolve the two proxy tunables whose "default" is derived from a
# neighbouring fact (goat_public_host / the endpoint hostname) — a
# derivation that can't live in vars/default.yml because those facts
# only exist after the set_fact block above.
#
#   * minio_ingress_upstream_vhost — three-state per README:
#       None            → goat_public_host (the addon default)
#       ""              → sentinel meaning "omit the annotation" so
#                         ingress-nginx forwards the browser's Host
#                         header verbatim
#       any other value → literal override
#     Compared against '' in the annotation-combine below to drive
#     inclusion of the `upstream-vhost` annotation.
#
#   * minio_ingress_ssl_name — SNI for the upstream TLS handshake.
#     Defaults to the endpoint hostname; only meaningful when the
#     upstream is HTTPS.
- name: "GOAT addon: resolve MinIO Ingress proxy vhost + SNI"
  ansible.builtin.set_fact:
    minio_ingress_upstream_vhost: "{{ goat_public_host if (goat_addon.s3.proxy.upstream_vhost is none) else goat_addon.s3.proxy.upstream_vhost }}"
    minio_ingress_ssl_name: "{{ goat_addon.s3.proxy.ssl_name if (goat_addon.s3.proxy.ssl_name | length > 0) else (goat_addon.s3.endpoint | urlsplit('hostname') | default('', true)) }}"

# External-mode only: proxy target for the `/<bucket>` Ingress below.
# Ingress backends must live in the same namespace; the external S3 is
# reachable from inside the cluster (operator-side network) but not
# from the public internet, so goat-web's presigned URLs (browser →
# public GOAT URL) would fail without an in-namespace representation
# of it. `ExternalName` stands in for the remote host as a plain DNS
# alias — assumes `endpoint` is a hostname, not an IP literal.
#
# `definition:` is a YAML block scalar (a string), not an inline dict.
# Why: Ansible without `jinja2_native` renders every `"{{ … }}"` scalar
# as a string, so an inline dict yields `port: "9000"` and the API
# server rejects it with `cannot unmarshal string into … ServicePort
# .spec.ports.port of type int32`. As a string, the k8s module parses
# the definition as YAML itself — `port: 9000` (unquoted) is typed as
# int32 at parse time, bypassing the Jinja stringification.
- name: "GOAT addon: create ExternalName service for external S3"
  when: goat_addon.s3.mode == 'external'
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    definition: |
      apiVersion: v1
      kind: Service
      metadata:
        name: goat-s3-upstream
        namespace: {{ k8s_namespace }}
        labels:
          app.kubernetes.io/name: goat
          app.kubernetes.io/part-of: goat
          app.kubernetes.io/managed-by: civitas-goat-addon
      {% if inv_k8s.ingress_class == 'traefik' and (s3_endpoint_is_tls | bool) %}
        annotations:
          # Traefik has no Ingress-level backend-protocol annotation; the
          # upstream scheme is a per-Service concern. Without this,
          # Traefik dials the HTTPS S3 endpoint as HTTP and the TLS
          # listener drops the connection mid-request (same failure mode
          # as ingress-nginx without `backend-protocol: HTTPS`).
          # Internal-CA endpoints additionally need a ServersTransport
          # CRD to skip verification — out of scope for this addon;
          # operators point at a publicly-rooted endpoint or provision
          # the transport themselves.
          traefik.ingress.kubernetes.io/service.serversscheme: https
      {% endif %}
      spec:
        type: ExternalName
        externalName: {{ goat_addon.s3.endpoint | urlsplit('hostname') }}
        ports:
          - name: api
            port: {{ goat_s3_upstream_port }}
            # Explicit targetPort: don't rely on the API server defaulting
            # targetPort=port. Some ingress controllers and downstream
            # tools inspect the port spec directly and treat an unset
            # targetPort as 0, which shows up as `Connection refused`
            # against a healthy upstream.
            targetPort: {{ goat_s3_upstream_port }}

# nginx: default request body limit is 1 MB and default read/send timeouts
# are 60s — both break dataset uploads to MinIO, hence the annotations
# below. Traefik has no default request body size limit and higher default
# timeouts, so the nginx-only annotations are conditional. HTTPS redirect
# on Traefik is expected to be configured at the entrypoint (or via a
# redirectScheme middleware) — see README.
#
# Backend protocol: ingress-nginx defaults to HTTP with the upstream. When
# `goat_addon.s3.endpoint` is `https://…`, plaintext HTTP to an S3 TLS
# listener triggers an immediate connection reset once the request body
# starts flowing (`writev() failed (104: Connection reset by peer) while
# sending request to upstream`) — visible to the browser as 502. The
# `backend-protocol` annotation switches the upstream leg to HTTPS; the
# derivation via `s3_endpoint_is_tls` covers both modes (in_cluster ==
# HTTP, external == whatever scheme the operator supplied).
#
# `upstream-vhost`: SigV4 signs the request host. The fronting reverse
# proxy of an operator-run cluster typically rewrites the Host header to
# the internal ingress name; without this annotation, presigned GETs
# (thumbnail loads, downloads) return `SignatureDoesNotMatch`. POST
# policies are unaffected — the browser upload happens to work — but
# every read fails. Set to the browser-facing host so signatures
# validate end-to-end. Empty `minio_ingress_upstream_vhost` (operator
# opted out via `inv_addons.goat.s3.proxy.upstream_vhost: ""`) omits
# the annotation entirely so the Host header passes through.
#
# `proxy-ssl-name` + `proxy-ssl-server-name`: SNI on the upstream TLS
# handshake. ingress-nginx's built-in default for `proxy_ssl_name` is
# `$proxy_host` — under the dynamic-upstream architecture that variable
# is the literal string `upstream_balancer`, which no S3 endpoint
# presents a cert for. Name-based-virtual-hosted endpoints (R2, most
# CDN-fronted MinIO deployments) will refuse the handshake with
# `SSL: unknown protocol` at that point. Set the SNI explicitly to the
# endpoint hostname so the endpoint can serve the right cert.
#
# `proxy-next-upstream` + `-tries`: retry a POST/PUT that arrived on a
# stale keepalive connection. Without `non_idempotent` in the list,
# ingress-nginx will not retry an upload against a fresh upstream
# connection — the browser sees a 502 that a retry would have avoided.
# Two tries covers the common "one keepalive slot expired between the
# controller's pool check and the actual write" race.
#
# `set_fact` preserves the dict type only when the whole value is a single
# `{{ expr }}` — do NOT use `>-` here, that folds to a string.
- name: "GOAT addon: build MinIO ingress annotations for {{ inv_k8s.ingress_class }}"
  ansible.builtin.set_fact:
    minio_ingress_annotations: "{{ minio_base_annotations | combine(minio_nginx_annotations if inv_k8s.ingress_class == 'nginx' else {}) | combine(minio_nginx_vhost_annotation if (inv_k8s.ingress_class == 'nginx' and minio_ingress_upstream_vhost | length > 0) else {}) | combine(minio_nginx_tls_annotations if (inv_k8s.ingress_class == 'nginx' and (s3_endpoint_is_tls | bool)) else {}) }}"
  vars:
    # `cert-manager.io/cluster-issuer` intentionally omitted — the Certificate
    # is owned by tasks/06_certificate.yml; leaving the annotation on made
    # five reconcilers (four chart ingresses + this one) race for one
    # object. `kubernetes.io/ingress.class` intentionally omitted —
    # deprecated, silently diverges from spec.ingressClassName. No
    # `rewrite-target` in any branch: SigV4 signs the canonical URI and
    # the upstream S3 expects exactly `/<bucket>/<key>` in path style.
    minio_base_annotations: {}
    minio_nginx_annotations:
      # ssl-redirect follows civitas-core convention: clusters that
      # terminate TLS at the ingress redirect (http=false); clusters where
      # a fronting proxy already terminates TLS skip the redirect to avoid
      # a loop (http=true).
      nginx.ingress.kubernetes.io/ssl-redirect: "{{ 'false' if (inv_k8s.ingress.http | default(false)) else 'true' }}"
      nginx.ingress.kubernetes.io/whitelist-source-range: "{{ user_whitelist | default(['0.0.0.0/0']) | join(',') }}"
      nginx.ingress.kubernetes.io/proxy-body-size: "{{ goat_addon.s3.proxy.max_body_size }}"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
      # ExternalName Services have no ClusterIP. When `service-upstream`
      # is enabled cluster-wide, ingress-nginx calls
      # getServiceClusterEndpoint() for this backend and hard-fails with
      # "no ClusterIP found", 502-ing every browser upload. Pin it off
      # here rather than relying on the cluster default.
      nginx.ingress.kubernetes.io/service-upstream: "false"
      # Uploads: stream the request body to the upstream instead of
      # buffering it to /tmp/nginx/client-body/ first. Without this, every
      # PUT is written to disk on the ingress pod before a single byte
      # reaches S3 — the access log shows `a client request body is
      # buffered to a temporary file` and large uploads latency-spike.
      nginx.ingress.kubernetes.io/proxy-request-buffering: "{{ goat_addon.s3.proxy.request_buffering }}"
      nginx.ingress.kubernetes.io/proxy-next-upstream: "{{ goat_addon.s3.proxy.next_upstream }}"
      nginx.ingress.kubernetes.io/proxy-next-upstream-tries: "{{ goat_addon.s3.proxy.next_upstream_tries }}"
      nginx.ingress.kubernetes.io/backend-protocol: "{{ 'HTTPS' if (s3_endpoint_is_tls | bool) else 'HTTP' }}"
    # Emitted only when `minio_ingress_upstream_vhost` is non-empty.
    # Split out from `minio_nginx_annotations` so the operator override
    # `inv_addons.goat.s3.proxy.upstream_vhost: ""` can suppress the
    # annotation entirely (a set-to-empty annotation would still take
    # effect and blank the Host header).
    minio_nginx_vhost_annotation:
      nginx.ingress.kubernetes.io/upstream-vhost: "{{ minio_ingress_upstream_vhost }}"
    minio_nginx_tls_annotations:
      # Upstream TLS verification. Default `off`.
      # NOTE: with the addon's default config this annotation is a no-op.
      # ingress-nginx's template only renders `proxy_ssl_verify` when
      # `ProxySSL.CAFileName` is non-empty, which is populated from the
      # `proxy-ssl-secret` annotation (client-CA Secret). The addon does
      # not provision `proxy-ssl-secret`, so the underlying nginx
      # directive is never emitted. Kept for forward compatibility when
      # a CA secret is wired in — flip to `true` via
      # `inv_addons.goat.s3.proxy.ssl_verify: true` at that point.
      nginx.ingress.kubernetes.io/proxy-ssl-verify: "{{ 'on' if (goat_addon.s3.proxy.ssl_verify | bool) else 'off' }}"
      # Explicit SNI. See comment above the set_fact for the "why".
      nginx.ingress.kubernetes.io/proxy-ssl-name: "{{ minio_ingress_ssl_name }}"
      nginx.ingress.kubernetes.io/proxy-ssl-server-name: "on"

- name: "GOAT addon: assert S3 ingress path matches bucket name"
  ansible.builtin.assert:
    that:
      - s3_ingress_path == '/' + goat_addon.s3.bucket
    fail_msg: >-
      The MinIO ingress path must equal '/' + the bucket name, otherwise
      path-style presigned URL signatures will not validate.

# Paths list for the single ingress-host rule below. Kept as a `set_fact`
# to keep the backend + path definition out of the Ingress definition
# inline (Ansible/Jinja stringification of ints in inline dicts).
- name: "GOAT addon: build MinIO ingress paths"
  ansible.builtin.set_fact:
    minio_ingress_paths:
      - path: "{{ s3_ingress_path }}"
        pathType: Prefix
        backend:
          service:
            # in_cluster mode: the MinIO Deployment this file provisions.
            # external mode: the ExternalName service above proxies to
            # `goat_addon.s3.endpoint`.
            name: "{{ 'minio' if goat_addon.s3.mode == 'in_cluster' else 'goat-s3-upstream' }}"
            # Named port (`api`) instead of an int sidesteps Ansible/Jinja
            # stringification of ints in k8s `definition:` dicts. Both
            # Services (in_cluster MinIO + ExternalName) expose an `api`
            # port so the reference resolves in either mode.
            port:
              name: api

- name: "GOAT addon: deploy MinIO public ingress (for browser uploads)"
  when:
    - goat_addon.enable_ingress | default(true) | bool
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    definition:
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: minio
        namespace: "{{ goat_addon.namespace }}"
        # `name` + `part-of` match the labels the goat Helm chart emits on
        # its four ingresses, so cluster-wide selectors that inventory the
        # goat stack (e.g. `-l app.kubernetes.io/name=goat`) find this one
        # too — without them the MinIO ingress was invisible to those
        # queries and easy to miss when debugging routing.
        labels:
          app.kubernetes.io/managed-by: civitas-goat-addon
          app.kubernetes.io/name: goat
          app.kubernetes.io/part-of: goat
        annotations: "{{ minio_ingress_annotations }}"
      spec:
        ingressClassName: "{{ inv_k8s.ingress_class }}"
        tls:
          - hosts:
              - "{{ goat_ingress_host }}"
            secretName: "{{ goat_tls_secret }}"
        rules:
          - host: "{{ goat_ingress_host }}"
            http:
              paths: "{{ minio_ingress_paths }}"

- name: "GOAT addon: wait for MinIO to be ready"
  when: goat_addon.s3.mode == 'in_cluster'
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    api_version: apps/v1
    kind: Deployment
    name: minio
    namespace: "{{ goat_addon.namespace }}"
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 180

# Shared S3 endpoint facts for the bucket-init and ducklake-init Jobs. In
# in_cluster mode these resolve to the in-namespace Service; in external
# mode they resolve to the operator-supplied endpoint.
#
#   * s3_job_endpoint_url  — full URL for `mc alias set` (with scheme,
#                            no trailing slash)
#   * s3_job_hostport      — host:port for DuckDB's `s3_endpoint` (no
#                            scheme, no trailing slash)
#   * s3_job_use_ssl       — 'true'/'false' string for DuckDB `s3_use_ssl`
#   * s3_job_url_style     — 'path' or 'vhost' for DuckDB `s3_url_style`
#
# `| trim` guards against surrounding whitespace from YAML folding of the
# `>-` block; trailing-slash strip guards against operator-supplied
# endpoints like `https://s3.example.com/`.
- name: "GOAT addon: resolve S3 endpoint facts for bucket-init and ducklake-init Jobs"
  ansible.builtin.set_fact:
    s3_job_endpoint_url: >-
      {{ (goat_addon.s3.endpoint
          if goat_addon.s3.mode == 'external'
          else 'http://minio.' + goat_addon.namespace + '.svc.cluster.local:9000')
         | trim | regex_replace('/+$', '') }}
    s3_job_hostport: >-
      {{ (goat_addon.s3.endpoint
          if goat_addon.s3.mode == 'external'
          else 'http://minio.' + goat_addon.namespace + '.svc.cluster.local:9000')
         | trim | regex_replace('/+$', '') | regex_replace('^https?://', '') }}
    s3_job_use_ssl: "{{ 'true' if (s3_endpoint_is_tls | bool) else 'false' }}"
    s3_job_url_style: >-
      {{ ('vhost'
          if (goat_addon.s3.mode == 'external'
              and not goat_addon.s3.force_path_style)
          else 'path') | trim }}

# Bucket creation runs in in_cluster mode only. External-mode credentials
# are typically scoped to a specific bucket without `s3:CreateBucket`, and
# the bucket is provisioned by the operator out-of-band — attempting
# `mc mb` would hang here with AccessDenied. `mc mb` is idempotent when it
# runs; we still delete-and-recreate the Job each run because Job specs are
# immutable.
- name: "GOAT addon: clean up prior bucket-init Job"
  when: goat_addon.s3.mode == 'in_cluster'
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    state: absent
    api_version: batch/v1
    kind: Job
    name: goat-bucket-init
    namespace: "{{ goat_addon.namespace }}"
    wait: true

- name: "GOAT addon: create goat bucket in S3"
  when: goat_addon.s3.mode == 'in_cluster'
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    state: present
    definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: goat-bucket-init
        namespace: "{{ goat_addon.namespace }}"
        labels:
          app.kubernetes.io/managed-by: civitas-goat-addon
      spec:
        backoffLimit: 3
        template:
          spec:
            restartPolicy: OnFailure
            containers:
              - name: mc
                image: "{{ software.addon_goat.images.minio_mc.registry }}/{{ software.addon_goat.images.minio_mc.repository }}:{{ software.addon_goat.images.minio_mc.tag }}"
                imagePullPolicy: "{{ software.addon_goat.images.minio_mc.pullPolicy | default('IfNotPresent') }}"
                env:
                  - name: MC_ENDPOINT
                    value: "{{ s3_job_endpoint_url }}"
                  - name: MC_ACCESS_KEY
                    valueFrom:
                      secretKeyRef: { name: goat-s3-credentials, key: access_key }
                  - name: MC_SECRET_KEY
                    valueFrom:
                      secretKeyRef: { name: goat-s3-credentials, key: secret_key }
                command: ["/bin/sh", "-c"]
                args:
                  - |
                    set -euo pipefail
                    mc alias set goat "$MC_ENDPOINT" "$MC_ACCESS_KEY" "$MC_SECRET_KEY"
                    mc mb --ignore-existing goat/{{ goat_addon.s3.bucket }}
                    echo "bucket goat/{{ goat_addon.s3.bucket }} ready at $MC_ENDPOINT"

- name: "GOAT addon: wait for bucket-init Job to complete"
  when: goat_addon.s3.mode == 'in_cluster'
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    api_version: batch/v1
    kind: Job
    name: goat-bucket-init
    namespace: "{{ goat_addon.namespace }}"
    wait: true
    wait_condition:
      type: Complete
      status: "True"
    wait_timeout: 120

# DuckLake bootstrap. The chart's `DUCKLAKE_CREATE_IF_NOT_EXISTS` env var is
# unused dead config — geoapi attaches in READ_ONLY mode and DuckDB refuses
# to create a missing lake. The lake must already exist before any read-only
# consumer (geoapi, processes) starts. A small Python script does the
# initial ATTACH (read-write, no READ_ONLY flag) which creates the catalog
# tables in Postgres + the metadata layout in S3.
#
# INVARIANT: the catalog's on-disk format is written by the DuckDB extension
# baked into the GOAT image. Every service that later attaches this catalog
# (geoapi, processes, windmill-worker-tools) must run the same GOAT release
# — see vars/software_references.yml.goat_release. Historically this Job ran
# on `python:3.11-slim` and did `pip install duckdb==X.Y.Z`, which decoupled
# the catalog format from the runtime extension version and produced hard
# `DuckLake catalog version mismatch` failures at first attach. The Job now
# runs from the `processes` image so its extension IS the runtime extension.
- name: "GOAT addon: fetch goat-postgres-creds for ducklake init"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    api_version: v1
    kind: Secret
    name: goat-postgres-creds
    namespace: "{{ goat_addon.namespace }}"
  register: goat_pg_creds

- name: "GOAT addon: create ducklake-init script ConfigMap"
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: ducklake-init-script
        namespace: "{{ goat_addon.namespace }}"
        labels:
          app.kubernetes.io/managed-by: civitas-goat-addon
      data:
        init.py: |
          """One-shot DuckLake catalog bootstrap. Runs from the `processes`
          image so LOAD alone hits the extensions baked into
          DUCKDB_EXTENSION_DIRECTORY, and the catalog's on-disk format
          matches every runtime attach."""

          import os
          import duckdb
          from goatlib.storage.ducklake import (
              REQUIRED_DUCKDB_EXTENSIONS,
              configure_baked_extensions,
          )

          con = duckdb.connect()
          if not configure_baked_extensions(con):
              raise RuntimeError(
                  "DUCKDB_EXTENSION_DIRECTORY unset — refusing to fall back to "
                  "extensions.duckdb.org from a cluster Job."
              )
          print("extension_directory:",
                con.execute("select current_setting('extension_directory')").fetchone()[0])
          for ext in REQUIRED_DUCKDB_EXTENSIONS:
              con.execute(f"LOAD {ext};")

          con.execute("SET s3_endpoint = ?;", [os.environ["S3_ENDPOINT"]])
          con.execute("SET s3_access_key_id = ?;", [os.environ["S3_KEY"]])
          con.execute("SET s3_secret_access_key = ?;", [os.environ["S3_SECRET"]])
          # SET only takes literal booleans / strings, not bind params.
          # Values are inventory-derived (not user input), and s3_url_style
          # is whitelisted so the interpolation is safe.
          url_style = os.environ.get("S3_URL_STYLE", "path")
          if url_style not in ("path", "vhost"):
              raise ValueError(
                  f"S3_URL_STYLE must be 'path' or 'vhost', got: {url_style!r}"
              )
          con.execute(f"SET s3_url_style = '{url_style}';")
          use_ssl = os.environ.get("S3_USE_SSL", "false").lower() == "true"
          con.execute(f"SET s3_use_ssl = {'true' if use_ssl else 'false'};")

          pg_uri = (
              f"host={os.environ['PG_HOST']} port={os.environ.get('PG_PORT', '5432')} "
              f"user={os.environ['PG_USER']} password={os.environ['PG_PASS']} "
              f"dbname={os.environ['PG_DB']} "
              f"keepalives=1 keepalives_idle=30 keepalives_interval=5 "
              f"keepalives_count=5"
          )

          # Local path matches DUCKLAKE_DATA_DIR in goat_values.yml.
          # DuckLake stores parquet in S3 via the s3_* SET commands above;
          # the local path is the catalog/ATTACH marker only.
          data_path = "/app/data/ducklake"
          os.makedirs(data_path, exist_ok=True)
          schema = os.environ["SCHEMA"]

          # No READ_ONLY → DuckDB creates the catalog if it doesn't exist.
          # AUTOMATIC_MIGRATION TRUE is the ONLY place a catalog format
          # upgrade can happen: goatlib's runtime attach
          # (packages/python/goatlib/src/goatlib/storage/ducklake.py,
          # _attach_ducklake) hardcodes its option list with no migration
          # flag, so services would otherwise fail on a version-mismatched
          # existing catalog after a GOAT release bump.
          con.execute(
              f"ATTACH 'ducklake:postgres:{pg_uri}' AS lake ("
              f"  DATA_PATH '{data_path}',"
              f"  METADATA_SCHEMA '{schema}',"
              f"  AUTOMATIC_MIGRATION TRUE"
              f")"
          )
          print(f"DuckLake initialized: schema={schema} data={data_path}")
          con.close()

- name: "GOAT addon: clean up prior ducklake-init Job"
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    state: absent
    api_version: batch/v1
    kind: Job
    name: ducklake-init
    namespace: "{{ goat_addon.namespace }}"
    wait: true

- name: "GOAT addon: bootstrap DuckLake catalog (one-shot)"
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    state: present
    definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: ducklake-init
        namespace: "{{ goat_addon.namespace }}"
        labels:
          app.kubernetes.io/managed-by: civitas-goat-addon
      spec:
        backoffLimit: 3
        # Hard cap so the LOAD/INSTALL fallback can't hang when an offline
        # mirror is unreachable — activeDeadlineSeconds terminates the Job
        # regardless of what DuckDB's C code is blocked on.
        activeDeadlineSeconds: 300
        template:
          spec:
            restartPolicy: OnFailure
            containers:
              - name: init
                # Run from the `processes` image so init.py uses the exact
                # same DuckDB extension version as every runtime service that
                # will later attach this catalog. Bootstrapping from a bare
                # python image + `pip install duckdb==X` (the previous
                # arrangement) decoupled catalog format from runtime version
                # and produced hard `DuckLake catalog version mismatch`
                # failures at first attach.
                image: "{{ software.addon_goat.images.processes.registry }}/{{ software.addon_goat.images.processes.repository }}:{{ software.addon_goat.images.processes.tag }}"
                imagePullPolicy: "{{ software.addon_goat.images.processes.pullPolicy | default('IfNotPresent') }}"
                env:
                  - name: PG_HOST
                    value: "{{ goat_addon.db.host }}"
                  - name: PG_PORT
                    value: "{{ goat_addon.db.port }}"
                  - name: PG_USER
                    valueFrom:
                      secretKeyRef: { name: goat-postgres-creds, key: username }
                  - name: PG_PASS
                    valueFrom:
                      secretKeyRef: { name: goat-postgres-creds, key: password }
                  - name: PG_DB
                    value: "{{ goat_addon.db.goat_db_name }}"
                  - name: S3_ENDPOINT
                    value: "{{ s3_job_hostport }}"
                  - name: S3_USE_SSL
                    # `| string` prevents Ansible jinja2-native from coercing
                    # the 'true'/'false' string back to a Python bool, which
                    # would serialize to JSON `true` and fail K8s EnvVar
                    # validation ("cannot unmarshal bool into ... string").
                    value: "{{ s3_job_use_ssl | string }}"
                  - name: S3_URL_STYLE
                    value: "{{ s3_job_url_style }}"
                  - name: S3_KEY
                    valueFrom:
                      secretKeyRef: { name: goat-s3-credentials, key: access_key }
                  - name: S3_SECRET
                    valueFrom:
                      secretKeyRef: { name: goat-s3-credentials, key: secret_key }
                  - name: BUCKET
                    value: "{{ goat_addon.s3.bucket }}"
                  - name: SCHEMA
                    value: "ducklake"
                # Explicit venv interpreter — the processes image builds into
                # /venv (UV_PROJECT_ENVIRONMENT), and a bare `python` may
                # resolve to the system interpreter that lacks duckdb.
                command: ["/venv/bin/python"]
                args: ["/scripts/init.py"]
                volumeMounts:
                  - name: script
                    mountPath: /scripts
                    readOnly: true
            volumes:
              - name: script
                configMap:
                  name: ducklake-init-script

- name: "GOAT addon: wait for DuckLake bootstrap Job"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    api_version: batch/v1
    kind: Job
    name: ducklake-init
    namespace: "{{ goat_addon.namespace }}"
    wait: true
    wait_condition:
      type: Complete
      status: "True"
    wait_timeout: 300
