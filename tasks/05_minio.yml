# /home/p4b/civitas-goat-addon/tasks/05_minio.yml
---
# geoapi (and the chart's `processes` service when enabled) need S3-compatible
# object storage to back the DuckLake data files. The GOAT chart doesn't ship
# MinIO yet (planned for chart Phase 2/3 per Chart.yaml), and civitas-core
# doesn't have a cluster-wide object store either. So we run a minimal
# single-replica MinIO inside the goat namespace, with a bucket-create Job.
#
# Mirrors plan4better's compose.yaml topology (quay.io/minio images).
# Single-replica + PVC = fine for local/dev; not HA, not for prod scale.

# Shared DuckLake data volume. layer_import (worker-tools) writes parquet
# under /app/data/ducklake/...; geoapi reads it for tile serving. Both must
# see the same files — hence one PVC mounted on tools/workflows/geoapi via
# the chart's existingClaim wiring + extraVolumes (goat_values.yml).
#
# Storage class: inv_k8s.storage_class.rwx — production clusters set this to
# a real RWX class (NFS / Longhorn). Civitas's default `local-path` is
# RWO-only; multi-pod sharing relies on all data-touching pods co-scheduling
# on the same node (see README "Known caveats"). Switch the operator's
# storage class for production HA.
- name: "GOAT addon: create shared DuckLake data PVC"
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: goat-ducklake-data
        namespace: "{{ goat_addon.namespace }}"
        labels:
          app.kubernetes.io/managed-by: civitas-goat-addon
      spec:
        accessModes:
          # RWX for real multi-node clusters; local-path (k3d/k3s default)
          # cannot provision RWX — set pvc_access_mode: ReadWriteOnce there
          # (sharing then relies on co-scheduling, see README).
          - "{{ goat_addon.ducklake.pvc_access_mode | default('ReadWriteMany') }}"
        storageClassName: "{{ inv_k8s.storage_class.rwx }}"
        resources:
          requests:
            storage: "{{ goat_addon.ducklake.pvc_size | default('20Gi') }}"

- name: "GOAT addon: generate or reuse MinIO root credentials"
  block:
    - name: "GOAT addon: check for existing minio-credentials secret"
      kubernetes.core.k8s_info:
        kubeconfig: "{{ k8s_config }}"
        context: "{{ k8s_context }}"
        api_version: v1
        kind: Secret
        name: minio-credentials
        namespace: "{{ goat_addon.namespace }}"
      register: minio_existing

    - name: "GOAT addon: reuse existing MinIO credentials"
      ansible.builtin.set_fact:
        minio_access_key: "{{ minio_existing.resources[0].data.access_key | b64decode }}"
        minio_secret_key: "{{ minio_existing.resources[0].data.secret_key | b64decode }}"
      when: minio_existing.resources | length > 0

    - name: "GOAT addon: generate new MinIO credentials"
      ansible.builtin.set_fact:
        minio_access_key: "goat-{{ lookup('community.general.random_string', length=12, special=false) | lower }}"
        minio_secret_key: "{{ lookup('community.general.random_string', length=40, special=false) }}"
      when: minio_existing.resources | length == 0

- name: "GOAT addon: persist MinIO credentials secret"
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: minio-credentials
        namespace: "{{ goat_addon.namespace }}"
        labels:
          app.kubernetes.io/managed-by: civitas-goat-addon
      type: Opaque
      stringData:
        access_key: "{{ minio_access_key }}"
        secret_key: "{{ minio_secret_key }}"

- name: "GOAT addon: deploy MinIO (server + PVC + service)"
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    state: present
    definition: "{{ item }}"
  loop:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: minio-data
        namespace: "{{ goat_addon.namespace }}"
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: "{{ inv_k8s.storage_class.loc | default('local-path') }}"
        resources:
          requests:
            storage: 10Gi
    - apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: minio
        namespace: "{{ goat_addon.namespace }}"
        labels:
          app: minio
          app.kubernetes.io/managed-by: civitas-goat-addon
      spec:
        replicas: 1
        strategy:
          type: Recreate  # single-replica + RWO PVC → can't rolling-update
        selector:
          matchLabels:
            app: minio
        template:
          metadata:
            labels:
              app: minio
          spec:
            containers:
              - name: minio
                image: "{{ software.addon_goat.images.minio.registry }}/{{ software.addon_goat.images.minio.repository }}:{{ software.addon_goat.images.minio.tag }}"
                imagePullPolicy: "{{ software.addon_goat.images.minio.pullPolicy | default('IfNotPresent') }}"
                args: ["server", "--console-address", ":9001", "/data/s3"]
                ports:
                  - { name: api, containerPort: 9000 }
                  - { name: console, containerPort: 9001 }
                env:
                  - name: MINIO_ROOT_USER
                    valueFrom:
                      secretKeyRef:
                        name: minio-credentials
                        key: access_key
                  - name: MINIO_ROOT_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: minio-credentials
                        key: secret_key
                readinessProbe:
                  httpGet: { path: /minio/health/ready, port: 9000 }
                  periodSeconds: 5
                volumeMounts:
                  - { name: data, mountPath: /data }
            volumes:
              - name: data
                persistentVolumeClaim:
                  claimName: minio-data
    - apiVersion: v1
      kind: Service
      metadata:
        name: minio
        namespace: "{{ goat_addon.namespace }}"
      spec:
        selector:
          app: minio
        ports:
          - { name: api, port: 9000, targetPort: 9000 }
          - { name: console, port: 9001, targetPort: 9001 }

# Expose MinIO over HTTPS for browser-side uploads. Goat-core returns
# presigned S3 URLs that the SPA fetches directly — they MUST be HTTPS,
# or Chrome mixed-content-blocks them. The hostname mirrors the per-service
# subdomain convention (s3.<goat-host>) and gets a civitas-CA-signed cert
# via cert-manager so the browser trusts it without prompting.
- name: "GOAT addon: deploy MinIO public ingress (for browser uploads)"
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    definition:
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: minio
        namespace: "{{ goat_addon.namespace }}"
        labels:
          app.kubernetes.io/managed-by: civitas-goat-addon
        annotations:
          cert-manager.io/cluster-issuer: "{{ inv_k8s.cert_manager.issuer_name }}"
          kubernetes.io/ingress.class: "{{ inv_k8s.ingress_class }}"
          nginx.ingress.kubernetes.io/ssl-redirect: "true"
          # Datasets can be large; lift the 1 MB default and the 60s timeout.
          nginx.ingress.kubernetes.io/proxy-body-size: "5g"
          nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
          nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
      spec:
        ingressClassName: "{{ inv_k8s.ingress_class }}"
        tls:
          - hosts:
              - "s3.goat.{{ DOMAIN }}"
            secretName: "minio-s3-{{ DOMAIN }}-tls"
        rules:
          - host: "s3.goat.{{ DOMAIN }}"
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: minio
                      port: { number: 9000 }

- name: "GOAT addon: wait for MinIO to be ready"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    api_version: apps/v1
    kind: Deployment
    name: minio
    namespace: "{{ goat_addon.namespace }}"
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 180

# `mc mb` is idempotent — re-running the Job is safe but wastes pod scheduling
# time. We delete any prior bucket-init Job (Job specs are immutable; can't
# helm-patch in place) and recreate fresh each addon run.
- name: "GOAT addon: clean up prior bucket-init Job"
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    state: absent
    api_version: batch/v1
    kind: Job
    name: minio-bucket-init
    namespace: "{{ goat_addon.namespace }}"
    wait: true

- name: "GOAT addon: create goat bucket in MinIO"
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    state: present
    definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: minio-bucket-init
        namespace: "{{ goat_addon.namespace }}"
        labels:
          app.kubernetes.io/managed-by: civitas-goat-addon
      spec:
        backoffLimit: 3
        template:
          spec:
            restartPolicy: OnFailure
            containers:
              - name: mc
                image: "{{ software.addon_goat.images.minio_mc.registry }}/{{ software.addon_goat.images.minio_mc.repository }}:{{ software.addon_goat.images.minio_mc.tag }}"
                imagePullPolicy: "{{ software.addon_goat.images.minio_mc.pullPolicy | default('IfNotPresent') }}"
                env:
                  - name: MC_ACCESS_KEY
                    valueFrom:
                      secretKeyRef: { name: minio-credentials, key: access_key }
                  - name: MC_SECRET_KEY
                    valueFrom:
                      secretKeyRef: { name: minio-credentials, key: secret_key }
                command: ["/bin/sh", "-c"]
                args:
                  - |
                    set -euo pipefail
                    mc alias set goat http://minio:9000 "$MC_ACCESS_KEY" "$MC_SECRET_KEY"
                    mc mb --ignore-existing goat/{{ goat_addon.minio.bucket }}
                    echo "bucket goat/{{ goat_addon.minio.bucket }} ready"

- name: "GOAT addon: wait for bucket-init Job to complete"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    api_version: batch/v1
    kind: Job
    name: minio-bucket-init
    namespace: "{{ goat_addon.namespace }}"
    wait: true
    wait_condition:
      type: Complete
      status: "True"
    wait_timeout: 120

# DuckLake bootstrap. The chart's `DUCKLAKE_CREATE_IF_NOT_EXISTS` env var is
# unused dead config — geoapi attaches in READ_ONLY mode and DuckDB refuses
# to create a missing lake. The lake must already exist before any read-only
# consumer (geoapi, future processes) starts. A small Python script does the
# initial ATTACH (read-write, no READ_ONLY flag) which creates the catalog
# tables in Postgres + the metadata layout in S3.
- name: "GOAT addon: fetch goat-postgres-creds for ducklake init"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    api_version: v1
    kind: Secret
    name: goat-postgres-creds
    namespace: "{{ goat_addon.namespace }}"
  register: goat_pg_creds

- name: "GOAT addon: create ducklake-init script ConfigMap"
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: ducklake-init-script
        namespace: "{{ goat_addon.namespace }}"
        labels:
          app.kubernetes.io/managed-by: civitas-goat-addon
      data:
        init.py: |
          """One-shot DuckLake catalog bootstrap. Read env vars for connection
          details, then ATTACH the lake in read-write mode so DuckDB creates
          the catalog schema + S3 layout if missing."""
          import os
          import duckdb

          con = duckdb.connect()
          for ext in ("spatial", "httpfs", "postgres", "ducklake"):
              con.execute(f"INSTALL {ext}; LOAD {ext};")

          # DuckDB takes the endpoint as host[:port] and the scheme as a flag.
          endpoint = os.environ["S3_ENDPOINT"]
          use_ssl = endpoint.startswith("https://")
          host = endpoint.split("://", 1)[-1]
          con.execute("SET s3_endpoint = ?;", [host])
          con.execute("SET s3_access_key_id = ?;", [os.environ["S3_KEY"]])
          con.execute("SET s3_secret_access_key = ?;", [os.environ["S3_SECRET"]])
          con.execute("SET s3_url_style = 'path';")
          con.execute(f"SET s3_use_ssl = {'true' if use_ssl else 'false'};")

          pg_uri = (
              f"host={os.environ['PG_HOST']} port=5432 "
              f"user={os.environ['PG_USER']} password={os.environ['PG_PASS']} "
              f"dbname={os.environ['PG_DB']} "
              f"keepalives=1 keepalives_idle=30 keepalives_interval=5 "
              f"keepalives_count=5"
          )

          # Local path matches DUCKLAKE_DATA_DIR in goat_values.yml.
          # DuckLake stores parquet in S3 via the s3_* SET commands above;
          # the local path is the catalog/ATTACH marker only.
          data_path = "/app/data/ducklake"
          os.makedirs(data_path, exist_ok=True)
          schema = os.environ["SCHEMA"]

          # No READ_ONLY → DuckDB creates the catalog if it doesn't exist.
          con.execute(
              f"ATTACH 'ducklake:postgres:{pg_uri}' AS lake ("
              f"  DATA_PATH '{data_path}',"
              f"  METADATA_SCHEMA '{schema}'"
              f")"
          )
          print(f"DuckLake initialized: schema={schema} data={data_path}")
          con.close()

- name: "GOAT addon: clean up prior ducklake-init Job"
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    state: absent
    api_version: batch/v1
    kind: Job
    name: ducklake-init
    namespace: "{{ goat_addon.namespace }}"
    wait: true

- name: "GOAT addon: bootstrap DuckLake catalog (one-shot)"
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    state: present
    definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: ducklake-init
        namespace: "{{ goat_addon.namespace }}"
        labels:
          app.kubernetes.io/managed-by: civitas-goat-addon
      spec:
        backoffLimit: 3
        template:
          spec:
            restartPolicy: OnFailure
            containers:
              - name: init
                image: "{{ software.addon_goat.images.ducklake_init.registry }}/{{ software.addon_goat.images.ducklake_init.repository }}:{{ software.addon_goat.images.ducklake_init.tag }}"
                imagePullPolicy: "{{ software.addon_goat.images.ducklake_init.pullPolicy | default('IfNotPresent') }}"
                env:
                  - name: PG_HOST
                    value: "{{ goat_addon.db.central_db_name }}.{{ goat_addon.db.central_db_ns }}.svc.cluster.local"
                  - name: PG_USER
                    valueFrom:
                      secretKeyRef: { name: goat-postgres-creds, key: username }
                  - name: PG_PASS
                    valueFrom:
                      secretKeyRef: { name: goat-postgres-creds, key: password }
                  - name: PG_DB
                    value: "{{ goat_addon.db.goat_db_name }}"
                  - name: S3_ENDPOINT
                    value: "minio.{{ goat_addon.namespace }}.svc.cluster.local:9000"
                  - name: S3_KEY
                    valueFrom:
                      secretKeyRef: { name: minio-credentials, key: access_key }
                  - name: S3_SECRET
                    valueFrom:
                      secretKeyRef: { name: minio-credentials, key: secret_key }
                  - name: BUCKET
                    value: "{{ goat_addon.minio.bucket }}"
                  - name: SCHEMA
                    value: "ducklake"
                command: ["sh", "-c"]
                args:
                  - |
                    set -e
                    # Pin duckdb to match goatlib's `duckdb>=1.4.3` minimum:
                    # newer duckdb versions ship a newer DuckLake extension
                    # that creates catalogs geoapi's bundled goatlib can't
                    # read ("Only DuckLake versions 0.1-0.3 are supported").
                    pip install --quiet --no-cache-dir 'duckdb==1.4.3'
                    python /scripts/init.py
                volumeMounts:
                  - name: script
                    mountPath: /scripts
                    readOnly: true
            volumes:
              - name: script
                configMap:
                  name: ducklake-init-script

- name: "GOAT addon: wait for DuckLake bootstrap Job"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    api_version: batch/v1
    kind: Job
    name: ducklake-init
    namespace: "{{ goat_addon.namespace }}"
    wait: true
    wait_condition:
      type: Complete
      status: "True"
    wait_timeout: 300
