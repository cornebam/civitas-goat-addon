# /home/p4b/civitas-goat-addon/tasks/02_keycloak_client.yml
---
# Phase 2: provision a Keycloak OIDC client for GOAT in civitas's Keycloak.
# Pattern mirrors how civitas registers Grafana/Superset/etc.
#
# After this task runs, the K8s Secret `goat-keycloak-creds` exists in the
# goat namespace with keys: server-url, realm, client-id, client-secret,
# nextauth-secret. The chart's auth.existingSecret consumes it.

# Log in to the civitas platform Keycloak as the platform admin.
# civitas 1.5 does not ship the tasks/templates/keycloak_login.yaml helper
# that later releases provide, so we inline the same flow the airflow addon uses.
- name: "GOAT addon: get platform admin credentials"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    kind: Secret
    namespace: "{{ inv_access.ns_name }}"
    name: "{{ inv_access.platform.k8s_secret_name }}"
  register: admin_credentials

- name: "GOAT addon: store platform admin credentials"
  ansible.builtin.set_fact:
    ADMIN_USERNAME: "{{ admin_credentials.resources[0].data.MASTER_USERNAME | b64decode }}"
    ADMIN_PASSWORD: "{{ admin_credentials.resources[0].data.MASTER_PASSWORD | b64decode }}"
    cacheable: yes

- name: "GOAT addon: login to civitas Keycloak as platform admin"
  check_mode: no
  uri:
    method: POST
    url: "{{ inv_access.platform.hostname }}/realms/master/protocol/openid-connect/token"
    return_content: yes
    body_format: form-urlencoded
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    body:
      grant_type: "password"
      client_id: "admin-cli"
      username: "{{ ADMIN_USERNAME }}"
      password: "{{ ADMIN_PASSWORD }}"
    status_code: 200
  register: keycloak_login

- name: "GOAT addon: create goat-web client"
  uri:
    method: POST
    url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/clients"
    return_content: yes
    body_format: json
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    body: "{{ lookup('template', playbook_dir + '/addons/goat_addon/templates/goat-keycloak-client.json.j2') }}"
    headers:
      Accept: application/json
      Authorization: "Bearer {{ keycloak_login.json.access_token }}"
    status_code: 201,409
  register: client_goat_response

- name: "GOAT addon: note if goat-web client already exists"
  debug:
    msg: "goat-web client already exists in realm {{ inv_access.tenant.realm_name }}."
  when:
    - not ansible_check_mode
    - client_goat_response.status == 409
  
- name: Get clients
  check_mode: no
  uri:
    method: GET
    url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/clients"
    return_content: yes
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    headers:
      Accept: application/json
      Authorization: Bearer {{ keycloak_login.json.access_token }}
    status_code: 200
  register: clients

- name: "Get keycloak client Goat ID."
  set_fact:
    client_id_goat: "{{ clients.json | json_query(query) }}"
  vars:
    query: "[?clientId== '{{ goat_addon.keycloak.client_id }}'].id | [0]"

# Update the client on every run so hostname / subdomain / public_url
# changes reflect immediately. The previous POST-once-then-409 path froze
# `redirectUris` at first-create, and any later change surfaced at login as
# `invalid parameter: redirect_uri`. Keycloak's PUT applies only fields in
# the supplied representation; the client secret is NOT rotated (it lives
# on a separate /client-secret endpoint) so `goat-keycloak-creds` remains
# valid across updates. status_code 204 = updated (Keycloak returns no
# body on success).
- name: "GOAT addon: update goat-web client (idempotent host / URL refresh)"
  uri:
    method: PUT
    url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/clients/{{ client_id_goat }}"
    body_format: json
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    body: "{{ lookup('template', playbook_dir + '/addons/goat_addon/templates/goat-keycloak-client.json.j2') }}"
    headers:
      Accept: application/json
      Authorization: "Bearer {{ keycloak_login.json.access_token }}"
    status_code: 204

- name: "GOAT addon: fetch goat-web client secret"
  check_mode: no
  uri:
    method: GET
    url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/clients/{{ client_id_goat }}/client-secret"
    return_content: yes
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    headers:
      Accept: application/json
      Authorization: Bearer {{ keycloak_login.json.access_token }}
    status_code: 200
  register: keycloak_client_secret_response

- name: "{{ module }}: Extract Keycloak client secret"
  set_fact:
    client_secret: "{{ keycloak_client_secret_response.json.value }}"


# At this point, `client_secret` is set by the included civitas template.

- name: "GOAT addon: generate or fetch a stable NEXTAUTH_SECRET"
  # NextAuth.js needs a signing secret. We store it in the same K8s Secret
  # alongside the Keycloak client secret. Generated once per release; on
  # re-runs we keep the previous value if the K8s Secret already exists.
  block:
    - name: "GOAT addon: check for existing goat-keycloak-creds"
      kubernetes.core.k8s_info:
        kubeconfig: "{{ k8s_config }}"
        context: "{{ k8s_context }}"
        api_version: v1
        kind: Secret
        namespace: "{{ goat_addon.namespace }}"
        name: goat-keycloak-creds
      register: existing_keycloak_secret

    - name: "GOAT addon: reuse existing NEXTAUTH_SECRET if available"
      ansible.builtin.set_fact:
        nextauth_secret: "{{ existing_keycloak_secret.resources[0].data['nextauth-secret'] | b64decode }}"
      when:
        - existing_keycloak_secret.resources | length > 0
        - existing_keycloak_secret.resources[0].data['nextauth-secret'] is defined

    - name: "GOAT addon: generate a new NEXTAUTH_SECRET if none exists"
      ansible.builtin.set_fact:
        nextauth_secret: "{{ lookup('password', '/dev/null length=48 chars=ascii_letters,digits') }}"
      when: nextauth_secret is not defined

- name: "GOAT addon: create/update goat-keycloak-creds K8s Secret"
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: goat-keycloak-creds
        namespace: "{{ goat_addon.namespace }}"
        labels:
          app.kubernetes.io/managed-by: civitas-goat-addon
      type: Opaque
      stringData:
        server-url: "{{ inv_access.platform.hostname }}"
        realm: "{{ inv_access.tenant.realm_name }}"
        client-id: "{{ goat_addon.keycloak.client_id }}"
        client-secret: "{{ client_secret }}"
        nextauth-secret: "{{ nextauth_secret }}"
