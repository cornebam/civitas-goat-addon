---
# Civitas convention: each stack sets k8s_config / k8s_context / k8s_namespace
# once, then reuses them for every kubernetes.core.* call and for the shared
# tasks/templates/* helpers. Setting them here means the rest of the addon
# honours `inv_k8s.config.context` (multi-cluster) instead of relying on an
# ambient KUBECONFIG.
- name: "GOAT addon: set default facts for K8S"
  ansible.builtin.set_fact:
    k8s_config: "{{ K8S_KUBECONFIG_PATH }}/{{ goat_addon.ns_kubeconfig }}"
    k8s_context: "{{ inv_k8s.config.context }}"
    k8s_namespace: "{{ goat_addon.namespace }}"

# Uses the shared helper so `inv_k8s.podSecurityAdmission.enable` is honoured —
# it stamps `pod-security.kubernetes.io/enforce: restricted` on the namespace
# when enabled. Hand-rolling the Namespace here would silently skip that, and
# the goat pods would later be rejected on PSA-enforcing clusters.
- name: "GOAT addon: create a k8s namespace"
  ansible.builtin.include_tasks: tasks/templates/k8s-namespace.yml
  when: goat_addon.ns_create | bool

# NextAuth (running inside goat-web) makes server-side calls to Keycloak
# during the OIDC discovery flow. On clusters that use a private CA
# (typical for civitas), Node.js rejects the cert with
# UNABLE_TO_VERIFY_LEAF_SIGNATURE. We mirror the civitas-core CA bundle
# (canonical location `inv_k8s.ingress.ca_path` — same file that
# 02_keycloak_client.yml's `uri` calls pass as `ca_path:`) into the goat
# namespace as a ConfigMap and mount it via `NODE_EXTRA_CA_CERTS` /
# `REQUESTS_CA_BUNDLE` / `SSL_CERT_FILE` in goat_values.yml.
#
# Naming (`cacert` + `cacert.crt`) matches the convention other civitas
# addons follow.
- name: "GOAT addon: Create cacert ConfigMap"
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: cacert
        namespace: "{{ k8s_namespace }}"
      data:
        cacert.crt: |
          {{ lookup('file', inv_k8s.ingress.ca_path) }}
  when: inv_k8s.ingress.ca_path is defined and inv_k8s.ingress.ca_path != ""
