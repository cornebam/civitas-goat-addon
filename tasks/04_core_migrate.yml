# /home/p4b/civitas-goat-addon/tasks/04_core_migrate.yml
---
# Goat's helm chart (v0.3.x) ships no alembic / initial_data step — its
# core/deployment.yaml runs the default uvicorn entrypoint and assumes the
# schema is already in place. For a clean external-DB install that's the
# missing piece: the goat-core Pod boots, but every API call 500s because
# the accounts.*, customer.*, basic.* schemas don't exist yet.
#
# This addon fills that gap with a one-shot Kubernetes Job that uses the
# same goat-core image to run:
#   1. alembic upgrade heads        — creates schemas + tables
#   2. python -m core.scripts.initial_data — installs SQL functions,
#      triggers, and seeds the default user/org (used when AUTH=False).
#
# Both steps are idempotent — alembic skips already-applied revisions,
# initial_data refreshes function/trigger bodies and only inserts seed
# rows that don't exist. Safe to re-run on every playbook invocation.

- name: Recreate goat-core bootstrap Job so it runs against the current chart state
  kubernetes.core.k8s:
    state: absent
    kubeconfig: "{{ KUBECONFIG | default(lookup('env', 'KUBECONFIG')) | default(lookup('env', 'HOME') + '/.kube/config') }}"
    api_version: batch/v1
    kind: Job
    namespace: "{{ goat_addon.namespace }}"
    name: goat-core-bootstrap
    wait: true

- name: Create goat-core bootstrap Job (alembic + initial_data)
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ KUBECONFIG | default(lookup('env', 'KUBECONFIG')) | default(lookup('env', 'HOME') + '/.kube/config') }}"
    definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: goat-core-bootstrap
        namespace: "{{ goat_addon.namespace }}"
        labels:
          app.kubernetes.io/managed-by: civitas-goat-addon
          app.kubernetes.io/name: goat
          app.kubernetes.io/component: core-bootstrap
      spec:
        backoffLimit: 3
        ttlSecondsAfterFinished: 600
        template:
          metadata:
            labels:
              app.kubernetes.io/managed-by: civitas-goat-addon
              app.kubernetes.io/name: goat
              app.kubernetes.io/component: core-bootstrap
          spec:
            restartPolicy: Never
            containers:
              - name: bootstrap
                image: "{{ goat_addon_software.images.core.registry }}/{{ goat_addon_software.images.core.repository }}:{{ goat_addon_software.images.core.tag }}"
                imagePullPolicy: "{{ goat_addon_software.images.core.pullPolicy | default('IfNotPresent') }}"
                command: ["/bin/sh", "-ec"]
                args:
                  - |
                    cd /app/apps/core
                    echo "[bootstrap] alembic upgrade heads"
                    /venv/bin/alembic upgrade heads
                    echo "[bootstrap] initial_data: SQL functions + triggers + default user/org"
                    /venv/bin/python -m core.scripts.initial_data
                    echo "[bootstrap] done"
                env:
                  - name: POSTGRES_SERVER
                    value: "{{ goat_addon.db.central_db_name }}.{{ goat_addon.db.central_db_ns }}.svc.cluster.local"
                  - name: POSTGRES_PORT
                    value: "5432"
                  - name: POSTGRES_DB
                    value: "{{ goat_addon.db.goat_db_name }}"
                  - name: POSTGRES_USER
                    valueFrom:
                      secretKeyRef:
                        name: goat-postgres-creds
                        key: username
                  - name: POSTGRES_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: goat-postgres-creds
                        key: password

- name: Wait for goat-core bootstrap Job to complete
  kubernetes.core.k8s_info:
    kubeconfig: "{{ KUBECONFIG | default(lookup('env', 'KUBECONFIG')) | default(lookup('env', 'HOME') + '/.kube/config') }}"
    api_version: batch/v1
    kind: Job
    namespace: "{{ goat_addon.namespace }}"
    name: goat-core-bootstrap
  register: goat_core_bootstrap
  retries: 60
  delay: 5
  until:
    - goat_core_bootstrap.resources | length > 0
    - (goat_core_bootstrap.resources[0].status.succeeded | default(0)) > 0
       or (goat_core_bootstrap.resources[0].status.failed | default(0)) >= 3

- name: Fail loudly if bootstrap Job did not succeed
  ansible.builtin.fail:
    msg: >-
      goat-core-bootstrap Job did not succeed. Run
      `kubectl -n {{ goat_addon.namespace }} logs job/goat-core-bootstrap`
      to see what blew up.
  when: (goat_core_bootstrap.resources[0].status.succeeded | default(0)) == 0
