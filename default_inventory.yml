# /home/p4b/civitas-goat-addon/default_inventory.yml
---
inv_addons:
  goat:
    enable: true
    namespace: "{{ ENVIRONMENT }}-goat-stack"
    # GOAT release tag. Applied to every image built from plan4better/goat
    # (core, web, geoapi, processes, windmill-server, three windmill-worker
    # variants). See vars/software_references.yml for the rationale — they
    # must move together to keep the DuckLake catalog format consistent.
    release: "v2.4.58"
    chart:
      ref: "oci://ghcr.io/plan4better/charts/goat"
      version: "0.4.0"
    db:
      # Postgres database names. Defaults match upstream conventions.
      # Override only if you need to co-tenant multiple goat installs in
      # one Postgres cluster — note that windmill's *role* names
      # (windmill_admin, windmill_user) are hardcoded by its migrations
      # regardless of DB name, so two installs sharing one cluster would
      # still collide on those roles.
      goat_db_name: "goat"
      windmill_db_name: "windmill"
    keycloak:
      # The OIDC client ID to create in the civitas Keycloak realm.
      # The realm itself is read from inv_access.tenant.realm_name.
      client_id: "goat-web"
    web:
      # Public-facing URL of the goat stack. The whole stack is served from
      # this single hostname — /core, /geoapi, /processes and /<bucket> are
      # routed by path (see templates/goat_values.yml). Used for Keycloak
      # redirect URIs and NextAuth NEXTAUTH_URL.
      public_url: "https://goat.{{ DOMAIN }}"
    # Object storage. Default is a single-replica in-cluster MinIO deployed
    # by this addon. To point at pre-existing S3-compatible storage
    # (external MinIO, Cloudflare R2, Wasabi, Backblaze B2, or AWS S3),
    # set `mode: external` and fill in the endpoint + credential fields.
    # Preconditions for external: `access_key` + `secret_key` supplied
    # (keep them in ansible-vault); the bucket exists (or is creatable
    # with those creds); SigV4 region matches; path-style S3 is supported
    # unless `force_path_style: false`.
    # See README §External S3.
    # s3:
    #   bucket: "goat"
    #   mode: "external"
    #   endpoint: "http://minio.shared-minio.svc.cluster.local:9000"
    #   public_endpoint: "https://s3.{{ DOMAIN }}"
    #   region: "us-east-1"
    #   # Credentials — keep in ansible-vault under the `secrets` tree.
    #   access_key: "{{ secrets.inv_addons.goat.s3_access_key }}"
    #   secret_key: "{{ secrets.inv_addons.goat.s3_secret_key }}"
    #   # For real AWS S3:
    #   # provider: "aws"
    #   # force_path_style: false
