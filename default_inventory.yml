# /home/p4b/civitas-goat-addon/default_inventory.yml
---
inv_addons:
  goat:
    enable: true
    namespace: "{{ ENVIRONMENT }}-goat-stack"
    # GOAT release tag. Applied to every image built from plan4better/goat
    # (core, web, geoapi, processes, windmill-server, three windmill-worker
    # variants). See vars/software_references.yml for the rationale — they
    # must move together to keep the DuckLake catalog format consistent.
    release: "v2.4.58"
    # Chart source. By default the addon installs from the pre-fetched tarball
    # shipped in `addons/goat_addon/files/goat-<version>.tgz` — nothing to set
    # here unless you want to pin a non-default version or pull remotely.
    #
    # Bump the bundled chart: drop a new `.tgz` into `files/` and set
    # `chart.version` here (the default resolver builds the filename from it).
    # Pull remotely instead: uncomment `chart.ref` and point it at the OCI URL.
    # chart:
    #   ref: "oci://ghcr.io/plan4better/charts/goat"
    #   version: "0.4.0"
    db:
      # Postgres database names. Defaults match upstream conventions.
      # Override only if you need to co-tenant multiple goat installs in
      # one Postgres cluster — note that windmill's *role* names
      # (windmill_admin, windmill_user) are hardcoded by its migrations
      # regardless of DB name, so two installs sharing one cluster would
      # still collide on those roles.
      goat_db_name: "goat"
      windmill_db_name: "windmill"
    keycloak:
      # The OIDC client ID to create in the civitas Keycloak realm.
      # The realm itself is read from inv_access.tenant.realm_name.
      client_id: "goat-web"
    # Reverse-proxy topology: the addon distinguishes two hostnames.
    #   * INGRESS-HOST — <subdomain>.<INGRESS_DOMAIN>. What the cluster's
    #     ingress controller sees (SNI + Host header). TLS certificate is
    #     bound to THIS name.
    #   * PUBLIC-HOST  — <subdomain>.<DOMAIN>. What the browser sees. Used
    #     by NEXT_PUBLIC_*, NEXTAUTH_URL, Keycloak redirectUris,
    #     S3_PUBLIC_ENDPOINT_URL. Bakes into presigned S3 URLs and every
    #     OIDC redirect.
    # If your cluster has no reverse proxy in front, DOMAIN == INGRESS_DOMAIN
    # and the two collapse to one hostname. Behind an outer reverse proxy
    # they differ; see README.
    enable_ingress: true              # deploy chart + MinIO Ingresses
    enable_gateway: false             # Gateway API + HTTPRoute (opt-in)
    web:
      # Bausubdomäne. Composed with DOMAIN / INGRESS_DOMAIN by the addon:
      #   ingress-host = <subdomain>.<INGRESS_DOMAIN | default(DOMAIN)>
      #   public-URL   = https://<subdomain>.<DOMAIN>
      subdomain: "goat"
      # Optional override. If set, this replaces the composed public URL
      # above — useful for standalone dev setups. Keep unset in prod.
      # public_url: "https://goat.{{ DOMAIN }}"
    # Object storage. Default is a single-replica in-cluster MinIO deployed
    # by this addon. To point at pre-existing S3-compatible storage
    # (external MinIO, Cloudflare R2, Wasabi, Backblaze B2, or AWS S3),
    # set `mode: external` and fill in the endpoint + credential fields.
    # Only the cluster-internal `endpoint` is configured — the browser
    # reaches S3 via the addon-owned `/<bucket>` Ingress on the public
    # GOAT URL (proxies to an ExternalName service pointing at
    # `endpoint`), so there is no `public_endpoint` variable.
    # Preconditions for external: `access_key` + `secret_key` supplied
    # (keep them in ansible-vault); the bucket exists (or is creatable
    # with those creds); SigV4 region matches; path-style S3 is supported
    # unless `force_path_style: false`.
    # See README §External S3.
    # s3:
    #   bucket: "goat"
    #   mode: "external"
    #   endpoint: "http://minio.shared-minio.svc.cluster.local:9000"
    #   region: "us-east-1"
    #   # Credentials — keep in ansible-vault under the `secrets` tree.
    #   access_key: "{{ secrets.inv_addons.goat.s3_access_key }}"
    #   secret_key: "{{ secrets.inv_addons.goat.s3_secret_key }}"
    #   # For real AWS S3:
    #   # provider: "aws"
    #   # force_path_style: false
